<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>타자팡 - 종합 타자 연습</title>
    <meta name="description" content="화사한 레트로 아케이드 감성의 종합 타자 연습 스튜디오 (자리·낱말·짧은글·긴글 80% 무스크롤 전용 새 창, 펀펀 플레이 깃허브 오락실 명작 게임: 너구리, 라스트워, 보글보글, 슈퍼마리오, 비행기슈팅, 카트라이더 탑재)" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- 외부 글꼴은 화면 그리기를 막지 않도록 나중에 불러옴 (학교망에서 막혀 있어도 첫 화면이 바로 뜸) -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;900&family=Press+Start+2P&display=swap" rel="stylesheet" media="print" onload="this.media='all'" />
    <link rel="stylesheet" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" media="print" onload="this.media='all'" />
    <script>
      /* 새로 올린 뒤 예전 화면(지워진 파일)을 불러오다 멈추면 한 번만 새로 받아 옴 → 하얀 화면으로 멈추지 않게 */
      (function(){
        function again(){
          try{ if(sessionStorage.getItem('tp_reload_once'))return; sessionStorage.setItem('tp_reload_once','1'); }catch(e){}
          var u=new URL(location.href); u.searchParams.set('_r',Date.now().toString(36)); location.replace(u.toString());
        }
        window.addEventListener('error',function(e){var t=e&&e.target; if(t&&(t.tagName==='SCRIPT'||(t.tagName==='LINK'&&/stylesheet|modulepreload/.test(t.rel)))&&/\/assets\//.test(t.src||t.href||''))again();},true);
        window.addEventListener('vite:preloadError',function(e){ if(e&&e.preventDefault)e.preventDefault(); again(); });
        window.addEventListener('load',function(){ setTimeout(function(){ try{sessionStorage.removeItem('tp_reload_once');}catch(e){} },15000); });
      })();
    </script>
  </head>
  <body class="bg-[#fffdf8] text-slate-800 font-sans antialiased selection:bg-rose-400 selection:text-white">
    <style>
      .tp-boot{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#fffdf8;font-family:system-ui,'Malgun Gothic',sans-serif;z-index:2147483000;transition:opacity .22s ease}
      .tp-boot.pop{background:#3b2210}
      .tp-boot.bye{opacity:0;pointer-events:none}
      .tp-boot-card{display:flex;flex-direction:column;align-items:center;gap:14px;padding:26px 34px;border:4px solid #2c1507;border-radius:18px;background:#fff6dc;box-shadow:0 6px 0 #2c1507;color:#2c1507;font-weight:900;font-size:17px}
      .tp-boot-logo{font-size:30px;letter-spacing:1px}
      .tp-boot-logo b{color:#e2552d}
      .tp-boot-bar{width:200px;height:12px;border:3px solid #2c1507;border-radius:8px;background:#fde6a8;overflow:hidden}
      .tp-boot-bar i{display:block;height:100%;width:40%;background:#f59e0b;animation:tpboot 1s ease-in-out infinite alternate}
      @keyframes tpboot{from{margin-left:0}to{margin-left:60%}}
    </style>
    <div class="tp-boot" id="tp-boot"><div class="tp-boot-card"><div class="tp-boot-logo">⌨️ 타자<b>팡</b></div><div id="tp-boot-msg">타자팡 여는 중…</div><div class="tp-boot-bar"><i></i></div></div></div>
    <div id="root"></div>
    <script>
      /* 여는 중 화면 하나만 보여 주다가, 연습 화면이 다 맞춰지면 한 번에 부드럽게 걷어 냄 (중간 화면이 깜빡이지 않게) */
      (function(){
        var boot=document.getElementById('tp-boot'), pop=/[?&]popup=true/.test(location.search), done=false, mo;
        if(pop){boot.className='tp-boot pop';document.getElementById('tp-boot-msg').textContent='연습 창 여는 중…';}
        function bye(){if(done)return;done=true;if(mo)mo.disconnect();boot.className+=' bye';setTimeout(function(){boot.remove()},260);}
        function check(){
          var root=document.getElementById('root'); if(!root||!root.firstChild)return;
          if(!pop){bye();return;}
          if(document.querySelector('.tp-practice--ready'))return bye();
          if(!document.querySelector('.tp-practice,.pr-popup-loading'))setTimeout(function(){if(!document.querySelector('.tp-practice,.pr-popup-loading'))bye();},250);
        }
        mo=new MutationObserver(check);mo.observe(document.documentElement,{subtree:true,childList:true,attributes:true,attributeFilter:['class']});
        setTimeout(bye,8000);
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
