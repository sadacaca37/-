<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>포근숲 이야기</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap');

  :root{
    --sky-day:#bfe6f5;
    --sky-sunset:#f7c9a6;
    --sky-night:#4a4f86;
    --bg-panel:#fffdf6;
    --bg-panel-2:#fff6e8;
    --ink:#6b5645;
    --ink-soft:#a3907c;
    --line: rgba(107,86,69,0.2);
    --pink:#f5a9a8;
    --pink-deep:#e78482;
    --yellow:#f6d186;
    --yellow-deep:#e8b455;
    --mint:#8fd3c7;
    --mint-deep:#5fb3a6;
    --lavender:#c9b8e8;
    --grass:#bfe7b0;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    background:var(--bg-panel);
    color:var(--ink);
    font-family:'Gowun Dodum', sans-serif;
    overflow:hidden;
    -webkit-user-select:none; user-select:none;
  }
  .display{ font-family:'Jua', sans-serif; letter-spacing:.01em; }

  #stage{ position:fixed; inset:0; height:100%; width:100%; }
  #gl{ position:absolute; inset:0; display:block; width:100%; height:100%; }

  .panel{
    background:var(--bg-panel);
    border:3px solid var(--ink);
    border-radius:20px;
    box-shadow:0 6px 0 rgba(107,86,69,0.18), 0 10px 20px rgba(107,86,69,0.12);
  }
  .btn{
    font-family:'Jua', sans-serif; font-size:15px; color:#fff;
    background:var(--pink); border:3px solid var(--ink); border-radius:14px;
    padding:10px 22px; cursor:pointer;
    box-shadow:0 4px 0 var(--pink-deep);
    transition:transform 100ms ease, box-shadow 100ms ease;
  }
  .btn:hover{ transform:translateY(-2px); }
  .btn:active{ transform:translateY(2px); box-shadow:0 1px 0 var(--pink-deep); }
  .btn.yellow{ background:var(--yellow); box-shadow:0 4px 0 var(--yellow-deep); color:var(--ink); }
  .btn.mint{ background:var(--mint); box-shadow:0 4px 0 var(--mint-deep); color:#fff; }
  .btn.ghost{ background:var(--bg-panel); color:var(--ink); box-shadow:0 4px 0 var(--line); }
  .btn:disabled{ opacity:.45; cursor:not-allowed; transform:none !important; }
  .btn.small{ padding:6px 14px; font-size:13px; border-radius:10px; box-shadow:0 3px 0 rgba(0,0,0,.15); }

  /* ---------- floating layer ---------- */
  #floaters{ position:absolute; inset:0; pointer-events:none; overflow:hidden; z-index:30; }
  .floatnum{
    position:absolute; transform:translate(-50%,-50%);
    font-family:'Jua', sans-serif; font-size:17px; color:var(--ink);
    text-shadow:0 2px 0 #fff, -1px -1px 0 #fff, 1px -1px 0 #fff, -1px 1px 0 #fff, 1px 1px 0 #fff;
    animation:floatUp 1000ms ease-out forwards; white-space:nowrap;
  }
  .floatnum.item{ color:var(--mint-deep); }
  .floatnum.heart{ color:var(--pink-deep); font-size:20px; }
  .floatnum.sparkle{ color:var(--lavender); font-size:22px; }
  @keyframes floatUp{
    0%{ opacity:0; transform:translate(-50%,-40%) scale(.8); }
    14%{ opacity:1; transform:translate(-50%,-70%) scale(1); }
    100%{ opacity:0; transform:translate(-50%,-150%) scale(1); }
  }

  #toasts{ position:absolute; top:16px; left:50%; transform:translateX(-50%); display:flex; flex-direction:column; gap:6px; align-items:center; z-index:45; pointer-events:none; }
  .toast{
    background:var(--bg-panel); border:3px solid var(--ink); border-radius:14px; padding:7px 18px;
    font-family:'Jua',sans-serif; font-size:13px; color:var(--ink);
    box-shadow:0 4px 0 rgba(107,86,69,0.18);
    animation:toastIn 3000ms ease forwards;
  }
  @keyframes toastIn{
    0%{ opacity:0; transform:translateY(-10px); }
    10%{ opacity:1; transform:translateY(0); }
    84%{ opacity:1; }
    100%{ opacity:0; transform:translateY(-6px); }
  }

  .namelabel{ position:absolute; transform:translate(-50%,-100%); pointer-events:none; z-index:24;
    font-family:'Jua',sans-serif; font-size:12px; color:var(--ink); background:rgba(255,253,246,.88);
    border:2px solid var(--ink); border-radius:10px; padding:2px 9px; white-space:nowrap; }
  .namelabel .heart{ color:var(--pink-deep); margin-left:3px; }

  .prompt{ position:absolute; transform:translate(-50%,-100%); pointer-events:none; z-index:24;
    font-family:'Jua',sans-serif; font-size:12px; color:#fff; background:var(--mint-deep);
    border-radius:10px; padding:3px 10px; white-space:nowrap; box-shadow:0 3px 0 rgba(0,0,0,.15); }

  /* ---------- top HUD ---------- */
  #topleft{ position:absolute; top:14px; left:14px; z-index:35; padding:10px 16px; display:flex; flex-direction:column; gap:6px; min-width:170px; }
  .dayrow{ display:flex; align-items:center; gap:8px; font-family:'Jua',sans-serif; font-size:14px; }
  .timeicon{ width:26px; height:26px; border-radius:50%; background:var(--yellow); border:2px solid var(--ink); flex:none; }
  .vibewrap{ display:flex; align-items:center; gap:6px; }
  .vibetrack{ flex:1; height:8px; border-radius:5px; background:var(--bg-panel-2); border:2px solid var(--ink); overflow:hidden; }
  .vibefill{ height:100%; background:linear-gradient(90deg, var(--mint), var(--lavender)); width:0%; transition:width 300ms ease; }
  .vibelabel{ font-size:11px; color:var(--ink-soft); }

  #bagbtn{ position:absolute; top:14px; right:14px; z-index:35; width:54px; height:54px; border-radius:16px;
    display:flex; align-items:center; justify-content:center; font-size:24px; cursor:pointer; }
  #bagpanel{ position:absolute; top:76px; right:14px; z-index:36; width:230px; padding:12px; display:none; max-height:60vh; overflow:auto; }
  #bagpanel.show{ display:block; }
  #bagpanel h3{ margin:0 0 8px; font-family:'Jua',sans-serif; font-size:14px; }
  .itemrow{ display:flex; align-items:center; justify-content:space-between; padding:4px 2px; font-size:13px; border-bottom:1px dashed var(--line); }
  .itemrow:last-child{ border-bottom:none; }
  .itemname{ display:flex; align-items:center; gap:6px; }
  .itemicon{ font-size:16px; }
  .empty-hint{ color:var(--ink-soft); font-size:12px; text-align:center; padding:8px 0; }

  /* ---------- bottom contextual action ---------- */
  #actionhud{ position:absolute; left:50%; bottom:18px; transform:translateX(-50%); z-index:35; display:flex; gap:10px; align-items:center; }

  /* ---------- dialogue ---------- */
  #dialogue{ position:absolute; left:50%; bottom:18px; transform:translateX(-50%); z-index:50; width:min(640px,92vw); padding:16px 20px; display:none; }
  #dialogue.show{ display:block; }
  .dlg-top{ display:flex; align-items:center; gap:10px; margin-bottom:6px; }
  .portrait{ width:44px; height:44px; border-radius:50%; border:3px solid var(--ink); flex:none; }
  .dlg-name{ font-family:'Jua',sans-serif; font-size:15px; }
  .dlg-hearts{ margin-left:auto; font-size:13px; color:var(--pink-deep); }
  #dlgtext{ font-size:15px; line-height:1.5; min-height:44px; }
  .dlg-actions{ display:flex; flex-wrap:wrap; gap:8px; margin-top:12px; justify-content:flex-end; }

  #giftpicker{ position:absolute; left:50%; bottom:210px; transform:translateX(-50%); z-index:52; width:min(360px,90vw); padding:12px; display:none; }
  #giftpicker.show{ display:block; }
  #giftpicker h4{ margin:0 0 8px; font-family:'Jua',sans-serif; font-size:13px; }
  .giftrow{ display:flex; align-items:center; justify-content:space-between; padding:5px 4px; font-size:13px; }
  .giftrow button{ font-family:'Gowun Dodum',sans-serif; }

  /* ---------- crafting ---------- */
  #craftpanel{ position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); z-index:55; width:min(420px,92vw); padding:18px; display:none; }
  #craftpanel.show{ display:block; }
  #craftpanel h3{ margin:0 0 4px; font-family:'Jua',sans-serif; }
  #craftpanel .sub{ font-size:12px; color:var(--ink-soft); margin-bottom:10px; }
  .recipe{ display:flex; align-items:center; justify-content:space-between; gap:10px; padding:9px 6px; border-bottom:1px dashed var(--line); }
  .recipe:last-child{ border-bottom:none; }
  .recipe .info{ font-size:13px; }
  .recipe .need{ font-size:11px; color:var(--ink-soft); }
  .recipe .need.bad{ color:var(--pink-deep); }
  .closebar{ display:flex; justify-content:flex-end; margin-top:10px; }

  /* ---------- fishing ---------- */
  #fishpanel{ position:absolute; left:50%; bottom:18px; transform:translateX(-50%); z-index:55; width:min(420px,92vw); padding:18px; display:none; text-align:center; }
  #fishpanel.show{ display:block; }
  #fishpanel h3{ margin:0 0 10px; font-family:'Jua',sans-serif; }
  #fishtrack{ position:relative; height:20px; border-radius:10px; background:var(--bg-panel-2); border:2px solid var(--ink); overflow:hidden; margin-bottom:14px; }
  #fishzone{ position:absolute; top:0; bottom:0; background:var(--mint); opacity:.6; }
  #fishmarker{ position:absolute; top:-3px; width:6px; height:26px; background:var(--pink-deep); border-radius:3px; }
  #fishresult{ font-size:13px; color:var(--ink-soft); min-height:18px; margin-bottom:6px; }

  /* ---------- decorate palette ---------- */
  #decopalette{ position:absolute; left:50%; bottom:90px; transform:translateX(-50%); z-index:40; padding:10px; display:none; gap:8px; }
  #decopalette.show{ display:flex; }
  .decoitem{ width:56px; height:56px; border-radius:12px; background:var(--bg-panel-2); border:3px solid var(--ink);
    display:flex; flex-direction:column; align-items:center; justify-content:center; cursor:pointer; font-size:20px; position:relative; }
  .decoitem.active{ outline:3px solid var(--mint-deep); }
  .decoitem .cnt{ position:absolute; bottom:1px; right:3px; font-size:10px; font-family:'Jua',sans-serif; color:var(--ink-soft); }

  /* ---------- overlays ---------- */
  .overlay{ position:absolute; inset:0; z-index:60; display:flex; align-items:center; justify-content:center; flex-direction:column;
    background:linear-gradient(180deg, rgba(191,230,245,.88), rgba(246,209,134,.72)); text-align:center; padding:24px; }
  .overlay.hidden{ display:none; }
  .title-xl{ font-size:clamp(36px,8vw,72px); color:var(--pink-deep); margin:0;
    text-shadow:3px 3px 0 #fff, -2px -2px 0 #fff, 2px -2px 0 #fff, -2px 2px 0 #fff; }
  .title-sub{ margin:8px 0 22px; color:var(--ink); font-size:15px; font-family:'Jua',sans-serif; }
  .controls{ display:flex; gap:22px; flex-wrap:wrap; justify-content:center; margin:0 0 26px; max-width:560px; color:var(--ink); font-size:13px; }
  .controls div b{ display:block; font-family:'Jua',sans-serif; font-size:13px; margin-bottom:3px; color:var(--pink-deep); }

  #questline{ position:absolute; top:104px; left:14px; z-index:34; padding:9px 14px; max-width:min(270px,60vw);
    font-family:'Jua',sans-serif; font-size:12.5px; color:var(--ink); display:none; line-height:1.45; }
  #questline.show{ display:block; }
  #questline .qt{ color:var(--pink-deep); margin-bottom:3px; }
  #questline .qi{ font-family:'Gowun Dodum',sans-serif; font-size:12px; }
  #questline .qi.done{ color:var(--mint-deep); text-decoration:line-through; }
  .castrow{ display:flex; align-items:flex-end; justify-content:center; gap:6px; margin-bottom:6px; }
  .castrow img{ height:clamp(58px,11vh,96px); image-rendering:auto; filter:drop-shadow(0 4px 0 rgba(107,86,69,.25)); animation:castBob 2.4s ease-in-out infinite; }
  .castrow img.big{ height:clamp(74px,14vh,124px); }
  .castrow img:nth-child(2){ animation-delay:.3s } .castrow img:nth-child(3){ animation-delay:.6s } .castrow img:nth-child(4){ animation-delay:.9s } .castrow img:nth-child(5){ animation-delay:1.2s }
  @keyframes castBob{ 0%,100%{ transform:translateY(0) } 50%{ transform:translateY(-6px) } }
  .startbtns{ display:flex; gap:12px; flex-wrap:wrap; justify-content:center; }
  .endstats{ display:flex; gap:10px; flex-wrap:wrap; justify-content:center; margin:0 0 22px; }
  .endstats div{ background:var(--bg-panel); border:3px solid var(--ink); border-radius:14px; padding:8px 14px; font-family:'Jua',sans-serif; font-size:14px; }
  .endstats b{ display:block; font-size:20px; color:var(--pink-deep); }
  .portrait{ background-repeat:no-repeat; background-size:contain; background-position:50% 60%; }

  @media (max-width:640px){
    .title-xl{ font-size:40px; }
    #bagpanel{ width:200px; }
    #topleft{ min-width:140px; }
  }
</style>

<div id="stage">
  <canvas id="gl"></canvas>
  <div id="floaters"></div>
  <div id="toasts"></div>
  <div id="questline" class="panel"></div>

  <div id="topleft" class="panel">
    <div class="dayrow"><div class="timeicon" id="timeicon"></div><span id="daytext">1일차</span> · <span id="timelabel">아침</span></div>

  <div id="dialogue" class="panel">
    <div class="dlg-top">

  <div id="craftpanel" class="panel">

  <div class="overlay" id="startoverlay">

      <div><b>바닥 클릭·터치</b>그곳으로 이동</div>
      <div><b>주민·나무 클릭</b>대화하고 채집하기</div>

    <div style="margin-top:14px;font-size:11px;opacity:.65">3D 캐릭터: KayKit (Kay Lousberg) · Quaternius — 무료 공개(CC0)</div>

<script>
(function(){
"use strict";

/* ===================== state ===================== */
var state = {
  started:false,
  day:1, timeHours:8.2, timeSpeed: 1/55, // game-hours per real second (~55s per game-hour => 24h in ~22min)
  vibe:0,
  inventory: {},
  friendship: { mongle:0, rita:0 },
  flags: { metBosol:false, questStage:0, cluesMongle:false, ritaPurified:false, gaveGift:{}, offered:{}, saesumAwake:false },
  decorPlaced: [],
  moving:false
};
/* 새숨이를 깨우는 조건: 제단에 계절 선물 3가지 + 마을 활기 */
var OFFERINGS = [
  { item:'베리티', label:'베리 티', icon:'🍵', hint:'산딸기 2개로 제작대에서 만들기' },
  { item:'생선구이', label:'생선구이', icon:'🍢', hint:'연못 낚시로 물고기 2마리' },
  { item:'조개목걸이', label:'조개 목걸이', icon:'📿', hint:'연못가 조개 2개로 만들기' }
];
var VIBE_GOAL = 60;
var SAVE_KEY = 'pogeunforest-save-v1';

var ITEM_ICONS = { 사과:'🍎', 나뭇가지:'🌿', 솔방울:'🌰', 산딸기:'🍓', 꽃:'🌸', 조개:'🐚', 물고기:'🐟',
  베리티:'🍵', 조개목걸이:'📿', 정원벤치:'🪑', 가로등:'🏮', 생선구이:'🍢' };

function addItem(name, n){
  n = n||1;
  state.inventory[name] = (state.inventory[name]||0) + n;
  refreshBag();
}
function hasItem(name, n){ return (state.inventory[name]||0) >= (n||1); }
function takeItem(name, n){ state.inventory[name] = Math.max(0,(state.inventory[name]||0)-(n||1)); refreshBag(); }

function addVibe(n){
  state.vibe = Math.min(100, state.vibe+n);
  $('vibefill').style.width = state.vibe+'%';
  $('vibetext').textContent = state.vibe;
  if(state.vibe>=30 && !state.flags.vibe30){ state.flags.vibe30=true; toast('마을이 조금씩 밝아지고 있어요 ✨'); }
  if(state.vibe>=VIBE_GOAL && !state.flags.vibeGoal){ state.flags.vibeGoal=true; toast('마을 활기가 가득 찼어요! 제단의 등불이 켜졌어요 🌼'); if(typeof refreshShrine==='function') refreshShrine(); }
  if(typeof refreshQuest==='function') refreshQuest();
}

/* ===================== dom ===================== */
var $ = function(id){ return document.getElementById(id); };
var elFloaters=$('floaters'), elToasts=$('toasts'), elQuestline=$('questline');
var elStart=$('startoverlay');
var elBagBtn=$('bagbtn'), elBagPanel=$('bagpanel'), elBagList=$('baglist');
var elActionHud=$('actionhud');
var elDialogue=$('dialogue'), elDlgPortrait=$('dlgportrait'), elDlgName=$('dlgname'), elDlgHearts=$('dlghearts'),
    elDlgText=$('dlgtext'), elDlgActions=$('dlgactions');
var elGiftPicker=$('giftpicker'), elGiftList=$('giftlist');
var elCraftPanel=$('craftpanel'), elRecipeList=$('recipelist');
var elFishPanel=$('fishpanel'), elFishZone=$('fishzone'), elFishMarker=$('fishmarker'), elFishResult=$('fishresult');
var elDecoPalette=$('decopalette');
var elDayText=$('daytext'), elTimeLabel=$('timelabel'), elTimeIcon=$('timeicon');

function toast(msg){
  var d=document.createElement('div'); d.className='toast'; d.textContent=msg;
  elToasts.appendChild(d); setTimeout(function(){ d.remove(); }, 3100);
}
function setQuestline(msg){ refreshQuest(); }
/* 지금 할 일 판: 단계마다 무엇을 하면 되는지 보여 준다 */
function refreshQuest(){
  if(!elQuestline) return;
  var f = state.flags, title='', items=[];
  if(f.saesumAwake){ title='🌸 새숨이가 깨어났어요'; items=[{t:'마을을 마음껏 꾸미고 주민들과 놀아요', d:false}]; }
  else if(f.questStage<1){ title='📜 포근숲에 온 걸 환영해요'; items=[{t:'길 위의 보솔이(여우)에게 말 걸기', d:false}]; }
  else if(f.questStage<4){
    title='📜 흐려진 마음 편지';

/* ===================== 땅 모양: 가장자리 언덕, 작은 둔덕, 움푹한 연못, 새숨이 제단 언덕 ===================== */
var POND_C = { x:15, z:13 }, SHRINE_C = { x:0, z:-20.5 }, SHRINE_H = 1.0;
function smooth01(a,b,v){ var t=Math.max(0,Math.min(1,(v-a)/(b-a))); return t*t*(3-2*t); }
function heightAt(x,z){
  var r = Math.sqrt(x*x+z*z), ang = Math.atan2(z,x);
  var h = smooth01(21, 29, r) * (3.2 + 0.9*Math.sin(ang*3+0.4) + 0.5*Math.sin(ang*7+1.3));
  /* 마을 안 작은 둔덕 */
  [[-21,-2,4.2,1.3],[8,21,3.4,1.0],[-9,18,3.0,0.7],[20,-4,3.2,0.9]].forEach(function(m){
    var d = Math.sqrt((x-m[0])*(x-m[0])+(z-m[1])*(z-m[1]));
    if(d < m[2]) h += m[3]*(0.5+0.5*Math.cos(Math.PI*d/m[2]));
  });
  /* 연못 자리는 언덕을 빼고 움푹하게 */
  var dp = Math.sqrt((x-POND_C.x)*(x-POND_C.x)+(z-POND_C.z)*(z-POND_C.z));
  h *= smooth01(7, 10.5, dp);
  if(dp < 6.9) h = -0.45 + (h+0.45)*smooth01(5.4, 6.9, dp);
  /* 새숨이 제단: 평평한 언덕 꼭대기 + 앞쪽 비탈(돌계단) */
  var ds = Math.sqrt((x-SHRINE_C.x)*(x-SHRINE_C.x)+(z-SHRINE_C.z)*(z-SHRINE_C.z));
  if(ds < 4.6) h = SHRINE_H;
  else if(ds < 7.2) h = SHRINE_H + (h-SHRINE_H)*smooth01(4.6, 7.2, ds);
  return h;
}

function makeGroundTexture(){
  var c=document.createElement('canvas'); c.width=512; c.height=512;
  var ctx=c.getContext('2d');
  ctx.fillStyle='#7ed164'; ctx.fillRect(0,0,512,512);
  for(var i=0;i<1600;i++){
    var x=Math.random()*512,y=Math.random()*512,r=Math.random()*2+0.5;
    var g = Math.random()<0.5 ? 'rgba(94,178,76,' : 'rgba(168,224,120,';
    ctx.fillStyle = g+(Math.random()*0.5+0.25)+')';
    ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2); ctx.fill();
  }
  var tex = new THREE.CanvasTexture(c);
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  tex.repeat.set(10,10);
  return tex;
}
var ground = (function(){
  var geo = new THREE.PlaneGeometry(90,90,150,150);
  geo.rotateX(-Math.PI/2);
  var pos = geo.attributes.position, cols = new Float32Array(pos.count*3);
  for(var i=0;i<pos.count;i++){
    var x=pos.getX(i), z=pos.getZ(i), h=heightAt(x,z);
    pos.setY(i, h);
    /* 높은 곳은 연두빛, 연못가는 모래빛 */
    var up = Math.max(0,Math.min(1,h/3.2)), low = h<0 ? Math.min(1,-h/0.45) : 0;
    cols[i*3]   = 1 + up*0.12 + low*0.35;
    cols[i*3+1] = 1 + up*0.06 + low*0.12;
    cols[i*3+2] = 1 - up*0.18 + low*0.05;
  }
  geo.setAttribute('color', new THREE.BufferAttribute(cols,3));
  geo.computeVertexNormals();
  var m = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({ map:makeGroundTexture(), roughness:0.95, metalness:0.02, color:0xffffff, vertexColors:true }));
  m.receiveShadow = true;
  scene.add(m);
  return m;
})();

function makePathTexture(){
  var c=document.createElement('canvas'); c.width=128; c.height=128;
  var ctx=c.getContext('2d');
  ctx.fillStyle='#eccf9a'; ctx.fillRect(0,0,128,128);
  for(var i=0;i<80;i++){
    ctx.fillStyle='rgba(205,170,115,'+(Math.random()*0.4+0.15)+')';
    ctx.beginPath(); ctx.arc(Math.random()*128,Math.random()*128,Math.random()*3+1,0,Math.PI*2); ctx.fill();
  }
  return new THREE.CanvasTexture(c);
}
var pathMat = new THREE.MeshStandardMaterial({ map:makePathTexture(), roughness:0.9 });
function addPath(x,z,w,d,rot){
  var geo = new THREE.PlaneGeometry(w,d,Math.max(1,Math.round(w*1.5)),Math.max(1,Math.round(d*1.5)));

  var m = new THREE.Mesh(geo, pathMat);

}

(function(){

  var seed = 7; function rnd(){ seed = (seed*16807)%2147483647; return seed/2147483647; }
  for(var i=0;i<60;i++){
    var a = rnd()*Math.PI*2, r = 22 + rnd()*14, x = Math.cos(a)*r, z = Math.sin(a)*r;
    var dp = Math.sqrt((x-POND_C.x)*(x-POND_C.x)+(z-POND_C.z)*(z-POND_C.z));

    rock.castShadow = true; rock.receiveShadow = true; scene.add(rock);

  for(var j=0;j<120;j++){
    var a2 = rnd()*Math.PI*2, r2 = 5 + rnd()*30, x2 = Math.cos(a2)*r2, z2 = Math.sin(a2)*r2;
    if(Math.abs(x2)<3 || Math.abs(z2)<3) continue; // 길 위는 비우기
    var dp2 = Math.sqrt((x2-POND_C.x)*(x2-POND_C.x)+(z2-POND_C.z)*(z2-POND_C.z));

    var tuft = new THREE.Group();

})();

var blobTex = (function(){
  var c=document.createElement('canvas'); c.width=64; c.height=64;
  var ctx=c.getContext('2d');
  var grad=ctx.createRadialGradient(32,32,2,32,32,30);
  grad.addColorStop(0,'rgba(80,70,60,0.35)'); grad.addColorStop(1,'rgba(80,70,60,0)');
  ctx.fillStyle=grad; ctx.fillRect(0,0,64,64);
  return new THREE.CanvasTexture(c);
})();
function addBlobShadow(radius){
  var mesh = new THREE.Mesh(new THREE.PlaneGeometry(radius*2,radius*2), new THREE.MeshBasicMaterial({map:blobTex, transparent:true, depthWrite:false}));
  mesh.rotation.x=-Math.PI/2; mesh.position.y=0.025;
  scene.add(mesh);
  return mesh;
}

/* ===================== 3D 캐릭터: 무료(CC0) 3D 모델 — KayKit(Kay Lousberg)·Quaternius ===================== */
var gltfLoader = new THREE.GLTFLoader();
var MODEL_CACHE = {};
function loadGLB(file){
  if(!MODEL_CACHE[file]) MODEL_CACHE[file] = new Promise(function(res){
    gltfLoader.load(file, function(g){ res(g); }, undefined, function(e){ console.warn('모델을 못 불러옴', file, e); res(null); });
  });
  return MODEL_CACHE[file];
}
/* 이 게임은 색을 그대로 내보내는 방식이라, 모델 색을 거기에 맞춘다 */
function fixMaterial(m){
  if(m.map){ m.map.encoding = THREE.LinearEncoding; m.map.needsUpdate = true; }
  if(m.color) m.color.convertLinearToSRGB();
  if(m.emissive) m.emissive.convertLinearToSRGB();
  if(m.color && MODEL_DIM !== 1) m.color.multiplyScalar(MODEL_DIM);
  m.toneMapped = false;
  if('roughness' in m) m.roughness = Math.max(m.roughness, 0.75);
  if('metalness' in m) m.metalness = Math.min(m.metalness, 0.2);
}
function buildChar(name, h){
  var def = MODEL_DEFS[name];
  var root = new THREE.Group(), body = new THREE.Group();
  root.add(body);
  var u = root.userData = { pivot:body, h:h, name:name, def:def, mixer:null, actions:{}, cur:null, oneShot:null, mats:[],
    tint:new THREE.Color(1,1,1), opacity:1, flash:false, ready:false, dead:false, idleT:3+Math.random()*5 };
  var files = [def.file].concat((def.attach||[]).map(function(a){ return a.file; }));
  Promise.all(files.map(loadGLB)).then(function(res){
    var g = res[0]; if(!g) return;
    var o = THREE.SkeletonUtils.clone(g.scene);
    (def.hide||[]).forEach(function(n){ var x = o.getObjectByName(n); if(x) x.visible = false; });
    (def.attach||[]).forEach(function(a, i){
      var w = res[i+1], bone = o.getObjectByName(a.bone);
      if(w && bone) bone.add(w.scene.clone());
    });
    o.traverse(function(c){
      if(!c.isMesh) return;
      c.castShadow = true; c.frustumCulled = false;
      var list = Array.isArray(c.material) ? c.material : [c.material];
      var nl = list.map(function(m){
        var mm = m.clone(); fixMaterial(mm);
        if(def.recolor && def.recolor[m.name] !== undefined) mm.color.setHex(def.recolor[m.name]);
        if(def.glow && mm.emissive){ mm.emissive.setHex(def.glow); mm.emissiveIntensity = def.glowI || 0.5; }
        mm.userData.base = mm.color.clone(); mm.userData.baseEm = mm.emissive ? mm.emissive.clone() : null;
        u.mats.push(mm);
        return mm;
      });
      c.material = Array.isArray(c.material) ? nl : nl[0];
    });
    o.updateMatrixWorld(true);
    var box = new THREE.Box3().setFromObject(o), hh = Math.max(0.01, box.max.y - box.min.y), s = h/hh;
    o.scale.setScalar(s); o.position.y = -box.min.y*s;
    body.add(o);
    u.mixer = new THREE.AnimationMixer(o);
    g.animations.forEach(function(clip){ u.actions[clip.name] = u.mixer.clipAction(clip); });
    u.mixer.addEventListener('finished', function(e){ if(u.oneShot && e.action === u.oneShot) u.oneShot = null; });
    u.ready = true;
    applyLook(root);
    playLoop(root, def.anims.idle);
    if(u.pending){ var p = u.pending; u.pending = null; playOnce(root, p.key, p.opts); }
    if(u.dead){ var d = u.actions[def.anims.die]; if(d){ d.reset(); d.setLoop(THREE.LoopOnce,1); d.clampWhenFinished = true; d.play(); u.cur = d; } }
  });
  return root;
}
function playLoop(g, clipName, speed){
  var u = g.userData, a = u.actions[clipName];
  if(!a) return;
  a.timeScale = speed || 1;
  if(u.cur === a) return;
  a.reset(); a.setLoop(THREE.LoopRepeat, Infinity); a.fadeIn(0.22).play();
  if(u.cur) u.cur.fadeOut(0.22);
  u.cur = a;
}
function playOnce(g, key, opts){
  var u = g.userData; opts = opts || {};
  if(!u.ready){ if(key !== 'hit') u.pending = { key:key, opts:opts }; return; }
  var a = u.actions[u.def.anims[key]];
  if(!a) return;
  a.reset(); a.setLoop(THREE.LoopOnce, 1); a.clampWhenFinished = !!opts.hold; a.timeScale = opts.speed || 1;
  a.fadeIn(0.08).play();
  if(u.cur && u.cur !== a) u.cur.fadeOut(0.1);
  u.cur = a; u.oneShot = a;
}
/* 매 프레임: 걷기/서기 동작을 고르고 움직임을 진행 */
function animChibi(g, dt, moving){
  var u = g.userData;
  if(!u.ready) return;
  if(!u.oneShot && !u.dead){
    if(!moving && u.def.anims.idle2){
      u.idleT -= dt;
      if(u.idleT < 0){ u.idleT = 6 + Math.random()*7; playOnce(g, 'idle2'); u.mixer.update(dt); return; }
    }
    playLoop(g, moving ? u.def.anims.walk : u.def.anims.idle, moving ? (u.def.walkSpeed||1) : 1);
  }
  u.mixer.update(dt);
}
function chibiAttack(g, key){ playOnce(g, key || 'attack', { speed: g.userData.def.atkSpeed || 1.25 }); }
function chibiHit(g){ var u = g.userData; if(u.dead || (u.oneShot && u.oneShot !== u.actions[u.def.anims.hit])) return; playOnce(g, 'hit', { speed:1.4 }); }
function chibiDie(g){ var u = g.userData; u.dead = true; u.oneShot = null; playOnce(g, 'die', { hold:true }); }
function chibiRevive(g){ var u = g.userData; u.dead = false; u.oneShot = null; if(u.ready){ u.mixer.stopAllAction(); u.cur = null; playLoop(g, u.def.anims.idle); } }
function chibiOnce(g, key){ if(!g.userData.dead) playOnce(g, key); }
function applyLook(g){
  var u = g.userData;
  u.mats.forEach(function(m){
    m.color.copy(m.userData.base).multiply(u.tint);
    m.transparent = u.opacity < 1; m.opacity = u.opacity; m.depthWrite = u.opacity >= 1;
    if(m.emissive){ if(u.flash) m.emissive.setRGB(0.55,0.12,0.08); else m.emissive.copy(m.userData.baseEm); }
  });
}
function chibiTint(g, r, gg, b){ g.userData.tint.setRGB(r, gg, b); applyLook(g); }
function chibiOpacity(g, o){ if(g.userData.opacity === o) return; g.userData.opacity = o; applyLook(g); }
function chibiFlash(g, on){ if(g.userData.flash === on) return; g.userData.flash = on; applyLook(g); }
/* 바라보는 방향을 부드럽게 돌린다 */
function turnTo(g, target, dt, speed){
  var cur = g.rotation.y, diff = target - cur;
  while(diff > Math.PI) diff -= Math.PI*2; while(diff < -Math.PI) diff += Math.PI*2;
  g.rotation.y = cur + diff*Math.min(1, dt*(speed||10));
}

var shrineOrbs = [];
(function(){
  var g = new THREE.Group();
  var stone = new THREE.MeshStandardMaterial({ color:0xd8d2c4, roughness:0.95 });
  var base = new THREE.Mesh(new THREE.CylinderGeometry(3.0,3.25,0.12,24), stone);
  base.position.y = 0.06; base.receiveShadow = true;
  var moss = new THREE.Mesh(new THREE.CylinderGeometry(2.3,2.3,0.03,24), new THREE.MeshStandardMaterial({ color:0x9fd48a, roughness:1 }));
  moss.position.y = 0.13; moss.receiveShadow = true;
  g.add(base, moss);
  /* 등불 기둥 4개: 선물 3가지 + 마을 활기 */
  for(var i=0;i<4;i++){
    var a = Math.PI*0.15 + i*(Math.PI*0.7/3) + Math.PI; // 제단 뒤쪽 반원
    var px = Math.cos(a)*2.4, pz = Math.sin(a)*2.4;
    var pillar = new THREE.Mesh(new THREE.CylinderGeometry(0.22,0.28,1.4,8), stone);
    pillar.position.set(px, 0.9, pz); pillar.castShadow = true;
    var orbMat = new THREE.MeshStandardMaterial({ color:0x9aa39a, emissive:0x000000, roughness:0.4 });
    var orb = new THREE.Mesh(new THREE.SphereGeometry(0.26,12,12), orbMat);
    orb.position.set(px, 1.82, pz);
    var light = new THREE.PointLight(0xd8ffb0, 0, 6, 2);
    light.position.copy(orb.position);
    g.add(pillar, orb, light);
    shrineOrbs.push({ mat:orbMat, light:light, mesh:orb });
  }
  /* 뒤편 큰 고목 */
  var trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.55,0.8,3.2,10), new THREE.MeshStandardMaterial({ color:0x8f6a48, roughness:0.9 }));
  trunk.position.set(0,1.6,-3.6); trunk.castShadow = true;
  var crownMat = new THREE.MeshStandardMaterial({ color:0x6fbf6a, roughness:0.85 });
  var crown = new THREE.Mesh(new THREE.SphereGeometry(2.4,14,12), crownMat);
  crown.position.set(0,4.3,-3.6); crown.castShadow = true;
  var crown2 = new THREE.Mesh(new THREE.SphereGeometry(1.6,12,10), crownMat);
  crown2.position.set(1.6,3.7,-3.0);
  var crown3 = new THREE.Mesh(new THREE.SphereGeometry(1.5,12,10), crownMat);
  crown3.position.set(-1.7,3.6,-3.1);
  g.add(trunk, crown, crown2, crown3);
  g.userData.crownMat = crownMat;
  g.position.set(SHRINE.x, SHRINE_H, SHRINE.z);
  scene.add(g);
  /* 제단으로 올라가는 돌계단 */
  var stepMat = new THREE.MeshStandardMaterial({ color:0xd2cbbb, roughness:0.95 });
  for(var si=0; si<5; si++){
    var sz = SHRINE.z + 6.9 - si*0.55;
    var step = new THREE.Mesh(new THREE.BoxGeometry(3.4, 0.3, 0.62), stepMat);
    step.position.set(0, heightAt(0, sz)-0.08, sz); step.castShadow=true; step.receiveShadow=true;
    scene.add(step);
  }
  addObstacle(SHRINE.x, SHRINE.z-3.6, 1.2);
  window.__shrineGroup = g;
})();
function refreshShrine(){
  var lit = OFFERINGS.map(function(o){ return !!state.flags.offered[o.item]; });
  lit.push(state.vibe >= VIBE_GOAL);
  shrineOrbs.forEach(function(o,i){
    var on = lit[i] || state.flags.saesumAwake;
    o.mat.color.setHex(on ? 0xeaffc4 : 0x9aa39a);
    o.mat.emissive.setHex(on ? 0x9fe07a : 0x000000);
    o.mat.emissiveIntensity = on ? 0.9 : 0;
    o.light.intensity = on ? 1.1 : 0;
  });
}

var FAVORITES = { mongle:['산딸기','베리티'], rita:['솔방울','조개목걸이'] };

function heartsStr(n){
  var full = Math.round(n/20);
  full = Math.max(0,Math.min(5,full));
  var s=''; for(var i=0;i<5;i++){ s += i<full?'❤':'🤍'; }
  return s;
}

var activeDialogue = null; // {npc, lines, idx, onEnd}
function openDialogue(npc, lines, opts){
  opts = opts||{};
  activeDialogue = { npc:npc, lines:lines, idx:0, choices:opts.choices||null, onDone:opts.onDone };
  elDlgPortrait.style.backgroundColor = npc.portraitColor;
  elDlgPortrait.style.backgroundImage = 'url(sprites/'+npc.sprite+'.webp)';
  elDlgName.textContent = npc.name;
  elDialogue.classList.add('show');
  renderDialogueStep();
}
function closeDialogue(){
  elDialogue.classList.remove('show');
  elGiftPicker.classList.remove('show');
  activeDialogue = null;
}
function renderDialogueStep(){
  if(!activeDialogue) return;
  var d = activeDialogue;
  elDlgText.textContent = d.lines[d.idx];
  var fr = d.npc.id==='mongle' ? state.friendship.mongle : d.npc.id==='rita' ? state.friendship.rita : null;
  elDlgHearts.textContent = fr!==null ? heartsStr(fr) : '';
  var isLast = d.idx >= d.lines.length-1;
  var html = '';
  if(!isLast){
    html += '<button class="btn small" id="dlgnext">다음</button>';
  } else {
    if(d.choices){
      d.choices.forEach(function(c,i){
        html += '<button class="btn small '+(c.cls||'')+'" data-ci="'+i+'">'+c.label+'</button>';
      });
    }
    if((d.npc.id==='mongle'||d.npc.id==='rita') && Object.keys(state.inventory).some(function(k){return state.inventory[k]>0;})){
      html += '<button class="btn small yellow" id="dlggift">선물하기</button>';
    }
    html += '<button class="btn small ghost" id="dlgclose">닫기</button>';
  }
  elDlgActions.innerHTML = html;
  var nextBtn = $('dlgnext');
  if(nextBtn) nextBtn.addEventListener('click', function(){ d.idx++; renderDialogueStep(); });
  var closeBtn = $('dlgclose');
  if(closeBtn) closeBtn.addEventListener('click', function(){ if(d.onDone) d.onDone(); closeDialogue(); });
  var giftBtn = $('dlggift');
  if(giftBtn) giftBtn.addEventListener('click', function(){ openGiftPicker(d.npc); });
  if(d.choices){
    d.choices.forEach(function(c,i){
      var b = elDlgActions.querySelector('[data-ci="'+i+'"]');
      if(b) b.addEventListener('click', function(){ closeDialogue(); c.action(); });
    });
  }
}

function openGiftPicker(npc){
  var keys = Object.keys(state.inventory).filter(function(k){ return state.inventory[k]>0; });
  if(!keys.length){ return; }
  elGiftList.innerHTML = keys.map(function(k,i){
    return '<div class="giftrow"><span>'+(ITEM_ICONS[k]||'▫️')+' '+k+' x'+state.inventory[k]+'</span><button class="btn small" data-gi="'+i+'">선물</button></div>';
  }).join('');
  keys.forEach(function(k,i){
    var b = elGiftList.querySelector('[data-gi="'+i+'"]');
    b.addEventListener('click', function(){ giveGift(npc,k); elGiftPicker.classList.remove('show'); });
  });
  elGiftPicker.classList.add('show');
}

function giveGift(npc, itemName){
  takeItem(itemName,1);
  var favs = FAVORITES[npc.id]||[];
  var isFav = favs.indexOf(itemName)!==-1;
  var fkey = npc.id==='mongle' ? 'friendship' : null;
  if(npc.id==='mongle') state.friendship.mongle = Math.min(100, state.friendship.mongle + (isFav?18:5));
  if(npc.id==='rita') state.friendship.rita = Math.min(100, state.friendship.rita + (isFav?18:5));
  spawnFloatText(npc.mesh.position, isFav ? (npc.name+' 최애 선물! ❤❤') : '고마워요', isFav?'heart':'item');
  toast((isFav? '💖 ' : '🙂 ') + npc.name+'에게 '+itemName+'을(를) 선물했어요');
  addVibe(isFav?4:2);
  if(npc.id==='rita' && itemName==='조개목걸이' && !state.flags.ritaPurified){
    purifyRita();
  }
  refreshBag();
}

/* ===================== foraging / fishing / crafting ===================== */
function spawnFloatText(worldPos, text, cls){
  var s = worldToScreen(worldPos.clone().add(new THREE.Vector3(0,1.4,0)));
  if(s.behind) return;
  var d=document.createElement('div');
  d.className='floatnum '+(cls||'');
  d.style.left=s.x+'px'; d.style.top=s.y+'px';
  d.textContent=text;
  elFloaters.appendChild(d);
  setTimeout(function(){ d.remove(); }, 1000);
}
function worldToScreen(vec3){
  var v=vec3.clone().project(camera);
  return { x:(v.x*0.5+0.5)*window.innerWidth, y:(-v.y*0.5+0.5)*window.innerHeight, behind:v.z>1 };
}

function harvestNode(node){
  if(node.isFishingSpot){ openFishing(); return; }
  if(node.isCraftStation){ openCraft(); return; }
  if(!node.ready) return;
  var item = node.pool[Math.floor(Math.random()*node.pool.length)];
  addItem(item,1);
  chibiOnce(player,'act');
  spawnFloatText(node.mesh.position, '+'+item, 'item');
  addVibe(1);
  node.ready = false;
  node.cooldown = node.kind==='tree' ? 16 : 10;
  node.mesh.scale.setScalar(0.15);
  var targetScale = node.kind==='tree' ? 1 : 1;
  var t0=performance.now();
  (function anim(){
    var t=Math.min(1,(performance.now()-t0)/260);
    node.mesh.scale.setScalar(0.15+0.85*t);
    if(t<1) requestAnimationFrame(anim);
  })();
}

var fishing = { active:false, dir:1, pos:0, zoneStart:0.55, zoneW:0.18 };
function openFishing(){
  fishing.active = true;
  fishing.pos = 0; fishing.dir=1;
  fishing.zoneStart = 0.35 + Math.random()*0.35;
  fishing.zoneW = 0.16;
  elFishZone.style.left = (fishing.zoneStart*100)+'%';
  elFishZone.style.width = (fishing.zoneW*100)+'%';
  elFishResult.textContent = '표시된 구간에서 낚아채기를 눌러보세요!';
  elFishPanel.classList.add('show');
}
function closeFishing(){ fishing.active=false; elFishPanel.classList.remove('show'); }
$('fishcatch').addEventListener('click', function(){
  if(!fishing.active) return;
  var hit = fishing.pos >= fishing.zoneStart && fishing.pos <= fishing.zoneStart+fishing.zoneW;
  if(hit){
    addItem('물고기',1);
    elFishResult.textContent = '🐟 물고기를 낚았어요!';
    addVibe(2);
  } else {
    elFishResult.textContent = '아쉬워요, 놓쳤어요.';
  }
  fishing.active = false;
  setTimeout(closeFishing, 900);
});
function updateFishing(dt){
  if(!fishing.active) return;
  fishing.pos += fishing.dir*dt*0.7;
  if(fishing.pos>1){ fishing.pos=1; fishing.dir=-1; }
  if(fishing.pos<0){ fishing.pos=0; fishing.dir=1; }
  elFishMarker.style.left = (fishing.pos*100)+'%';
}

  if(!hits.length) return null;
  var obj = hits[0].object;
  while(obj && !obj.userData.__root){ obj = obj.parent; }
  for(var i=0;i<npcs.length;i++){ if(npcs[i].mesh===obj) return {type:'npc',ref:npcs[i]}; }
  for(var j=0;j<forageNodes.length;j++){ if(forageNodes[j].mesh===obj) return {type:'node',ref:forageNodes[j]}; }
  return null;
}
npcs.forEach(function(n){ n.mesh.userData.__root=true; });
forageNodes.forEach(function(n){ n.mesh.userData.__root=true; });

function onPointerDown(e){
  if(!state.started) return;
  if(e.button!==0) return;
  if(activeDialogue) return;
  if(decorateMode){
    var p = getGroundPoint(e.clientX,e.clientY);
    if(p && selectedDecor){ placeDecor(p.x,p.z); }
    return;
  }
  var pick = pickThing(e.clientX,e.clientY);
  if(pick){
    interactTarget = pick; moveTarget=null;
  } else {
    var g = getGroundPoint(e.clientX,e.clientY);
    if(g){
      var d=Math.sqrt(g.x*g.x+g.z*g.z);
      if(d>ARENA_R-1){ var sc=(ARENA_R-1)/d; g.x*=sc; g.z*=sc; }
      moveTarget=g; interactTarget=null;
      marker.position.set(g.x,heightAt(g.x,g.z)+0.06,g.z); marker.visible=true;
    }
  }
}
canvas.addEventListener('mousedown', onPointerDown);
canvas.addEventListener('contextmenu', function(e){ e.preventDefault(); });
canvas.addEventListener('touchstart', function(e){
  if(!e.touches||!e.touches.length) return;
  onPointerDown({button:0, clientX:e.touches[0].clientX, clientY:e.touches[0].clientY});
}, {passive:true});

window.addEventListener('keydown', function(e){
  var k=e.key.toLowerCase(); keys[k]=true;
  if(['w','a','s','d'].indexOf(k)!==-1){ moveTarget=null; interactTarget=null; marker.visible=false; }
});
window.addEventListener('keyup', function(e){ keys[e.key.toLowerCase()]=false; });

function faceTowards(p){
  var dx=p.x-player.position.x, dz=p.z-player.position.z;
  if(Math.abs(dx)>0.001||Math.abs(dz)>0.001) playerFacing=Math.atan2(dx,dz);
}

function collideObstacles(pos,radius){
  for(var i=0;i<obstacles.length;i++){
    var o=obstacles[i];
    var dx=pos.x-o.x, dz=pos.z-o.z;
    var dist=Math.sqrt(dx*dx+dz*dz);
    var min=o.r+radius;
    if(dist<min && dist>0.0001){ var push=(min-dist); pos.x+=dx/dist*push; pos.z+=dz/dist*push; }
  }
}

/* ===================== update loop ===================== */
var INTERACT_RANGE = 2.0;
function updatePlayer(dt){
  var moved=false;
  var moveVec = new THREE.Vector3();
  var wasdActive = keys['w']||keys['a']||keys['s']||keys['d'];
  if(wasdActive){
    var mx=0,mz=0;
    if(keys['w']) mz-=1; if(keys['s']) mz+=1;
    if(keys['a']) mx-=1; if(keys['d']) mx+=1;
    moveVec.set(mx,0,mz);
    if(moveVec.lengthSq()>0){ moveVec.normalize(); moved=true; }
  } else if(interactTarget){
    var refPos = interactTarget.type==='npc' ? interactTarget.ref.mesh.position : interactTarget.ref.mesh.position;
    var toT = refPos.clone().sub(player.position); toT.y=0;
    var dist = toT.length();
    if(dist > INTERACT_RANGE){ moveVec.copy(toT.normalize()); moved=true; }
    else {
      faceTowards(refPos);
      if(interactTarget.type==='npc') handleNpcClick(interactTarget.ref);
      else harvestNode(interactTarget.ref);
      interactTarget = null;
    }
  } else if(moveTarget){
    var toM = new THREE.Vector3(moveTarget.x,0,moveTarget.z).sub(player.position);
    var dm = toM.length();
    if(dm>0.25){ moveVec.copy(toM.normalize()); moved=true; }
    else { moveTarget=null; marker.visible=false; }
  }

  if(moved){
    var speed=6.0;
    var step = moveVec.clone().multiplyScalar(speed*dt);
    player.position.add(step);
    var r=Math.sqrt(player.position.x*player.position.x+player.position.z*player.position.z);
    if(r>ARENA_R-0.6){ var sc=(ARENA_R-0.6)/r; player.position.x*=sc; player.position.z*=sc; }
    collideObstacles(player.position,0.5);
    faceTowards(player.position.clone().add(moveVec));
    walkPhase += dt*11;
  }
  animChibi(player, dt, moved);
  player.position.y = heightAt(player.position.x, player.position.z);
  turnTo(player, playerFacing, dt, 12);
  if(marker.visible) marker.rotation.z += dt*2;
}

function updateNpcs(t, dt){
  npcs.forEach(function(n){
    var base = heightAt(n.mesh.position.x, n.mesh.position.z);
    if(n.float){
      var awake = n.id==='saesum' && state.flags.saesumAwake;
      n.mesh.position.y = base + n.float + Math.sin(t*(awake?2.2:0.9)+n.phase)*(awake?0.22:0.06);
    } else {
      n.mesh.position.y = base;
    }
    animChibi(n.mesh, dt, false);
    /* 가까이 오면 플레이어 쪽으로 몸을 돌린다 */
    var dx = player.position.x-n.mesh.position.x, dz = player.position.z-n.mesh.position.z;
    var want = Math.PI/4;
    if(dx*dx+dz*dz < 64){ var rel = Math.atan2(dx,dz) - Math.PI/4; while(rel>Math.PI) rel-=Math.PI*2; while(rel<-Math.PI) rel+=Math.PI*2; want = Math.PI/4 + Math.max(-1.0, Math.min(1.0, rel)); }
    if(window.__pfPose) want = Math.PI/4; // 시험용(카드 사진 찍을 때)
    turnTo(n.mesh, want, dt, 4);
  });
  if(!state.flags.saesumAwake && Math.floor(t/2.6)!==saesum.zzz){
    saesum.zzz = Math.floor(t/2.6);
    var dx=player.position.x-saesum.mesh.position.x, dz=player.position.z-saesum.mesh.position.z;
    if(dx*dx+dz*dz < 144) spawnFloatText(saesum.mesh.position.clone().add(new THREE.Vector3(0.4,1.0,0)), 'Zzz…', 'sparkle');
  }
}

function updateNearbyPrompts(){
  document.querySelectorAll('.prompt').forEach(function(e){ e.remove(); });
  var best=null, bd=INTERACT_RANGE+0.4;
  npcs.concat(forageNodes.filter(function(n){return n.ready || n.isFishingSpot || n.isCraftStation;})).forEach(function(n){
    var pos = n.mesh ? n.mesh.position : null;
    if(!pos) return;
    var dx=pos.x-player.position.x, dz=pos.z-player.position.z;
    var d=Math.sqrt(dx*dx+dz*dz);
    if(d<bd){ bd=d; best=n; }
  });
  if(best){
    var label = best.name ? '대화하기' : best.label;
    var s = worldToScreen(best.mesh.position.clone().add(new THREE.Vector3(0, best.h?best.h+0.75:1.2,0)));
    if(!s.behind){
      var d=document.createElement('div');
      d.className='prompt';
      d.style.left=s.x+'px'; d.style.top=s.y+'px';
      d.textContent=label;
      elFloaters.appendChild(d);
    }
  }
}

function updateNameLabels(){
  document.querySelectorAll('.namelabel').forEach(function(e){ e.remove(); });
  npcs.forEach(function(n){
    var s = worldToScreen(n.mesh.position.clone().add(new THREE.Vector3(0,n.h+0.3,0)));
    if(s.behind) return;
    var d=document.createElement('div');
    d.className='namelabel';
    var fr = n.id==='mongle'?state.friendship.mongle : n.id==='rita'?state.friendship.rita : null;
    d.innerHTML = n.name + (fr!==null? ' <span class="heart">'+(fr>=20?'❤':'♡')+'</span>':'');
    d.style.left=s.x+'px'; d.style.top=s.y+'px';
    elFloaters.appendChild(d);
  });
}

function updateBlobs(){
  playerBlob.position.set(player.position.x, heightAt(player.position.x,player.position.z)+0.04, player.position.z);
  npcs.forEach(function(n){ n.blob.position.set(n.mesh.position.x, heightAt(n.mesh.position.x,n.mesh.position.z)+0.04, n.mesh.position.z); });
}

function updateForageRegrow(dt){
  forageNodes.forEach(function(n){
    if(!n.ready && !n.isFishingSpot && !n.isCraftStation){
      n.cooldown -= dt;
      if(n.cooldown<=0){ n.ready=true; }
    }
  });
}

function updateCamera(dt){
  camTarget.lerp(player.position, Math.min(1,dt*6));
  var desired = camTarget.clone().add(camOffset);
  camera.position.lerp(desired, Math.min(1,dt*6));
  camera.lookAt(camTarget.x, camTarget.y+1.0, camTarget.z);
}

/* ===================== day/night cycle ===================== */
function tickTime(dt){
  state.timeHours += dt*state.timeSpeed;
  if(state.timeHours>=24){ state.timeHours-=24; state.day++; }
  var h = state.timeHours;
  elDayText.textContent = state.day+'일차';
  var label = h<6?'깊은 밤':h<11?'아침':h<15?'낮':h<18?'노을':h<21?'저녁':'밤';
  elTimeLabel.textContent = label;

  // sun angle
  var ang = (h/24)*Math.PI*2 - Math.PI/2;
  var sunHeight = Math.sin(ang);
  sun.position.set(Math.cos(ang)*20, Math.max(2,sunHeight*22), 10);
  sun.target.position.set(0,0,0);

  var dayness = Math.max(0, sunHeight); // 0..1 daytime
  var duskness = Math.max(0, 1-Math.abs(sunHeight)*3); // near horizon
  var isNight = sunHeight < -0.05;

  var col = new THREE.Color();
  if(isNight){ col.copy(skyColorNight); }
  else { col.copy(skyColorDay).lerp(skyColorSunset, Math.min(1,duskness)); }
  scene.background.copy(col);
  scene.fog.color.copy(col);

  sun.intensity = isNight ? 0.1 : (0.4+dayness*0.35);
  hemi.intensity = isNight ? 0.22 : (0.4+dayness*0.3);
  fill.intensity = isNight ? 0.1 : 0.12;
  elTimeIcon.style.background = isNight ? '#c9b8e8' : (duskness>0.5 ? '#f5a9a8' : '#f6d186');

  lampPosts.forEach(function(lp){ lp.light.intensity = isNight ? 1.4 : 0; lp.lampMesh.material.emissiveIntensity = isNight?0.9:0.3; });
}

/* ===================== minimap-free HUD loop ===================== */
var clock = new THREE.Clock();
function loop(){
  requestAnimationFrame(loop);
  var dt = Math.min(0.05, clock.getDelta());
  var t = clock.elapsedTime;
  if(state.started){
    updatePlayer(dt);
    updateNpcs(t, dt);
    updateForageRegrow(dt);
    updateFishing(dt);
    tickTime(dt);
  }
  updateCamera(dt);
  updateBlobs();
  renderer.render(scene, camera);
  if(state.started && !activeDialogue){
    updateNearbyPrompts();
  } else {
    document.querySelectorAll('.prompt').forEach(function(e){ e.remove(); });
  }
  updateNameLabels();
}

/* ===================== boot ===================== */
/* ===================== 저장 / 이어하기 ===================== */
function saveGame(){
  if(!state.started) return;
  try{
    localStorage.setItem(SAVE_KEY, JSON.stringify({ v:1, day:state.day, timeHours:state.timeHours, vibe:state.vibe,
      inventory:state.inventory, friendship:state.friendship, flags:state.flags, decorPlaced:state.decorPlaced,
      px:player.position.x, pz:player.position.z }));
  }catch(e){}
}
function readSave(){ try{ var raw=localStorage.getItem(SAVE_KEY); return raw?JSON.parse(raw):null; }catch(e){ return null; } }
function applySave(d){
  state.day=d.day||1; state.timeHours=d.timeHours||8.2; state.vibe=d.vibe||0;
  state.inventory=d.inventory||{}; state.friendship=d.friendship||{mongle:0,rita:0};
  var f=d.flags||{}; f.gaveGift=f.gaveGift||{}; f.offered=f.offered||{}; state.flags=f;
  (d.decorPlaced||[]).forEach(function(dp){
    if(!DECOR_TYPES[dp.key]) return;
    var m=DECOR_TYPES[dp.key].build(); m.position.set(dp.x,heightAt(dp.x,dp.z),dp.z); scene.add(m);
    state.decorPlaced.push(dp);
  });
  if(typeof d.px==='number'){ player.position.set(d.px,0,d.pz); camTarget.copy(player.position); camera.position.copy(player.position).add(camOffset); }
  if(f.ritaPurified){ rita.shadowed=false; setNpcTint(rita,1,1,1); }
  if(f.saesumAwake){ setNpcTint(saesum,1,1,1); chibiOpacity(saesum.mesh, 1); if(window.__shrineGroup) window.__shrineGroup.userData.crownMat.color.setHex(0x8fe07a); }
  $('vibefill').style.width = state.vibe+'%'; $('vibetext').textContent = state.vibe;
}
function startGame(fromSave){
  if(fromSave){ var d=readSave(); if(d) applySave(d); }
  else { try{ localStorage.removeItem(SAVE_KEY); }catch(e){} }
  state.started = true;
  elStart.classList.add('hidden');
  refreshBag();
  addVibe(0);
  refreshShrine();
  refreshQuest();
  if(!fromSave) setTimeout(function(){ toast('길 위의 보솔이에게 말을 걸어 보세요!'); }, 600);
}
$('startbtn').addEventListener('click', function(){ startGame(false); });
$('continuebtn').addEventListener('click', function(){ startGame(true); });
(function(){ var d=readSave(); if(d && d.flags && (d.flags.metBosol || d.vibe>0)){ $('continuebtn').hidden=false; $('startbtn').textContent='처음부터 새로 하기'; $('startbtn').className='btn ghost'; } })();
$('keepplay').addEventListener('click', function(){ $('endoverlay').style.display='none'; });
$('restartbtn').addEventListener('click', function(){ try{ localStorage.removeItem(SAVE_KEY); }catch(e){} location.reload(); });
setInterval(saveGame, 8000);
window.addEventListener('pagehide', saveGame);
document.addEventListener('visibilitychange', function(){ if(document.hidden) saveGame(); });

if(/[?&]debug/.test(location.search)) window.__pf = { state:state, addItem:addItem, addVibe:addVibe, player:player, npcs:npcs, OFFERINGS:OFFERINGS,
  talk:handleNpcClick, camOffset:camOffset, tint:chibiTint, offer:offerToShrine, awaken:awakenSaesum, closeDialogue:closeDialogue, camTarget:camTarget, camera:camera, saveGame:saveGame };
resize();
tickTime(0);
loop();

})();
</script>
