<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>과자 왕국 런</title>
<style>
  :root{ --bg:#EAF6FF; --ink:#3A2418; --ink-soft:#7A5B49; --accent:#FF6F91; --accent-2:#FFC93C; --energy:#6ADB4C; --panel:#FFFFFF; --panel-border:#EADBCB; --shadow:0 18px 40px -18px rgba(60,40,20,.45); }
  @media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --bg:#1B1A24; --ink:#F6E9DD; --ink-soft:#CBAE9B; --accent:#FF87A3; --accent-2:#FFD35E; --energy:#7CE85C; --panel:#262331; --panel-border:#3E3947; --shadow:0 18px 40px -18px rgba(0,0,0,.7); } }
  :root[data-theme="dark"]{ --bg:#1B1A24; --ink:#F6E9DD; --ink-soft:#CBAE9B; --accent:#FF87A3; --accent-2:#FFD35E; --energy:#7CE85C; --panel:#262331; --panel-border:#3E3947; --shadow:0 18px 40px -18px rgba(0,0,0,.7); }
  *{box-sizing:border-box;}
  body{ background:var(--bg); color:var(--ink); }
  .wrap{ max-width:960px; margin:0 auto; padding-inline:16px; padding-block:22px 36px; font-family:'Nunito', system-ui, sans-serif; }
  h1.title{ font-family:'Baloo 2', system-ui, sans-serif; font-size:clamp(22px,4.5vw,30px); margin:0 0 12px; text-align:center; letter-spacing:.3px; }
  .frame{ position:relative; width:100%; aspect-ratio:16/9; border-radius:18px; overflow:hidden; box-shadow:var(--shadow); background:#8ED4F6; }
  canvas#game{ position:absolute; inset:0; width:100%; height:100%; display:block; touch-action:none; }
  .hud{ position:absolute; inset:0; pointer-events:none; font-family:'Baloo 2', system-ui, sans-serif; color:#fff; }
  .tl{ position:absolute; left:14px; top:8px; line-height:1.05; text-shadow:0 2px 0 rgba(0,0,0,.35), 0 0 10px rgba(0,0,0,.25); }
  .tl .pts{ font-size:clamp(20px,3.6vw,34px); font-weight:800; font-variant-numeric:tabular-nums; }
  .tl .combo{ font-size:clamp(11px,1.8vw,15px); font-weight:800; color:var(--accent-2); min-height:1.2em; }
  .tl .tag{ font-size:clamp(9px,1.3vw,12px); font-weight:800; opacity:.85; margin-top:2px; }
  .tl .lives{ font-size:clamp(12px,2vw,18px); letter-spacing:2px; color:#FF6F91; margin-top:1px; }
  .energy{ position:absolute; left:50%; top:10px; transform:translateX(-50%); width:min(40%,320px); }
  .energy .bar{ height:14px; border-radius:999px; background:rgba(0,0,0,.35); border:2px solid rgba(255,255,255,.8); overflow:hidden; }
  .energy .fill{ height:100%; width:100%; background:linear-gradient(90deg,#4CC33A,var(--energy)); transition:width .1s linear; }
  .energy .lbl{ text-align:center; font-size:10px; font-weight:800; letter-spacing:1px; text-shadow:0 1px 0 rgba(0,0,0,.4); margin-top:2px; }
  .bossbar{ position:absolute; left:50%; top:44px; transform:translateX(-50%); width:min(46%,380px); display:none; }
  .bossbar.on{ display:block; }
  .bossbar .bar{ height:10px; border-radius:999px; background:rgba(0,0,0,.4); border:2px solid #FFC93C; overflow:hidden; }
  .bossbar .fill{ height:100%; width:100%; background:linear-gradient(90deg,#B44DFF,#FF6F91); transition:width .15s; }
  .bossbar .lbl{ text-align:center; font-size:10px; font-weight:800; color:var(--accent-2); letter-spacing:1px; text-shadow:0 1px 0 rgba(0,0,0,.4); margin-top:2px; }
  .right{ position:absolute; right:12px; top:10px; display:flex; flex-direction:column; align-items:flex-end; gap:5px; }
  .pill{ background:rgba(255,255,255,.85); color:#3A2418; padding:2px 10px; border-radius:999px; font-size:11px; font-weight:800; }
  .mute{ pointer-events:auto; border:none; cursor:pointer; }
  .gauge{ width:110px; height:10px; border-radius:999px; background:rgba(0,0,0,.35); border:2px solid rgba(255,255,255,.8); overflow:hidden; }
  .gauge div{ height:100%; width:0%; background:linear-gradient(90deg,var(--accent),var(--accent-2)); transition:width .12s linear; }
  .buffs{ display:flex; flex-direction:column; align-items:flex-end; gap:3px; }
  .buff{ font-size:11px; font-weight:800; padding:2px 9px; border-radius:999px; color:#fff; text-shadow:0 1px 0 rgba(0,0,0,.4); }
  .buff.speed{ background:#FF8A3D; } .buff.shield{ background:#3DA9FF; } .buff.magnet{ background:#B44DFF; } .buff.giant{ background:#FFB000; } .buff.dash{ background:#FF4D7A; }
  .banner{ position:absolute; left:50%; top:38%; transform:translate(-50%,-50%) scale(.8); font-size:clamp(20px,4.2vw,40px); font-weight:800; text-align:center; text-shadow:0 3px 0 rgba(0,0,0,.35), 0 0 18px rgba(0,0,0,.35); opacity:0; transition:opacity .35s, transform .35s; white-space:nowrap; }
  .banner small{ display:block; font-size:.45em; letter-spacing:3px; color:var(--accent-2); }
  .banner.show{ opacity:1; transform:translate(-50%,-50%) scale(1); }
  .tbtn{ position:absolute; bottom:12px; pointer-events:auto; font-family:'Baloo 2', system-ui, sans-serif; font-size:clamp(13px,2vw,17px); font-weight:800; background:rgba(0,0,0,.35); color:#fff; border:2px solid rgba(255,255,255,.7); border-radius:999px; padding:10px 22px; -webkit-tap-highlight-color:transparent; user-select:none; }
  .tbtn.l{ left:14px; } .tbtn.r{ right:14px; }
  .tbtn:active{ background:rgba(255,111,145,.75); }
  @media (hover:hover) and (pointer:fine){ .tbtn{ opacity:.5; } }

  .overlay{ position:absolute; inset:0; display:flex; align-items:center; justify-content:center; background:rgba(30,20,40,.55); backdrop-filter:blur(2px); padding:10px; overflow:auto; }
  .card{ background:var(--panel); border:2px solid var(--panel-border); border-radius:18px; padding:14px 16px; max-width:600px; width:100%; text-align:center; box-shadow:0 20px 50px -20px rgba(0,0,0,.5); }
  .card h2{ font-family:'Baloo 2', system-ui, sans-serif; font-size:clamp(16px,2.4vw,20px); margin:0 0 6px; }
  .chars{ display:grid; grid-template-columns:repeat(4,1fr); gap:6px; margin:0 0 8px; }
  .ch{ border:2px solid var(--panel-border); border-radius:12px; padding:5px 4px; cursor:pointer; background:var(--bg); transition:transform .12s, border-color .12s; }
  .ch:hover{ transform:translateY(-2px); }
  .ch.sel{ border-color:var(--accent); box-shadow:0 0 0 3px rgba(255,111,145,.25); }
  .ch canvas{ width:100%; aspect-ratio:1; display:block; }
  .ch .nm{ font-family:'Baloo 2', system-ui, sans-serif; font-weight:800; font-size:clamp(9px,1.5vw,12px); }
  .ch .tp{ font-size:9.5px; color:var(--ink-soft); }
  .skill{ font-size:11.5px; margin:0 0 8px; }
  .skill b{ color:var(--accent); }
  .opts{ display:grid; grid-template-columns:1fr 1fr 1fr; gap:6px; margin:0 0 10px; }
  .opt{ text-align:left; }
  .opt .lb{ font-size:10px; font-weight:800; letter-spacing:1px; color:var(--ink-soft); margin-bottom:3px; }
  .seg{ display:flex; flex-wrap:wrap; gap:3px; }
  .seg button{ flex:1 1 auto; font-family:'Baloo 2', system-ui, sans-serif; font-size:11px; font-weight:800; padding:5px 6px; border-radius:8px; border:2px solid var(--panel-border); background:var(--bg); color:var(--ink); cursor:pointer; }
  .seg button.on{ border-color:var(--accent); background:var(--accent); color:#fff; }
  .hint{ font-size:10.5px; color:var(--ink-soft); min-height:1.3em; margin:2px 0 0; }
  .btn{ font-family:'Baloo 2', system-ui, sans-serif; background:var(--accent); color:#fff; border:none; padding:10px 26px; border-radius:999px; font-size:15px; cursor:pointer; box-shadow:0 10px 20px -8px rgba(255,111,145,.6); }
  .btn.ghost{ background:transparent; color:var(--ink); box-shadow:none; border:2px solid var(--panel-border); }
  .btn:focus-visible{ outline:3px solid var(--accent-2); outline-offset:2px; }
  .final{ font-family:'Baloo 2', system-ui, sans-serif; font-size:40px; color:var(--accent); margin:2px 0 0; }
  .final-sub{ font-size:12px; color:var(--ink-soft); margin-bottom:12px; }
  .row{ display:flex; gap:8px; justify-content:center; flex-wrap:wrap; }
  [hidden]{ display:none !important; }
  .footnote{ text-align:center; font-size:11.5px; color:var(--ink-soft); margin-top:12px; }
  @media (max-width:560px){ .opts{ grid-template-columns:1fr; } .card{ padding:10px; } .ch .tp{ display:none; } }
</style>
</head>
<body>


<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=Nunito:wght@400;700;800&display=swap">

<div class="wrap">
  <h1 class="title">과자 왕국 런</h1>
  <div class="frame" id="frame">
    <canvas id="game"></canvas>
    <div class="hud">
      <div class="tl"><div class="pts" id="score">0</div><div class="combo" id="combo"></div><div class="tag" id="stageTag"></div><div class="lives" id="lives">●●●</div></div>
      <div class="energy"><div class="bar"><div class="fill" id="energyFill"></div></div><div class="lbl">ENERGY</div></div>
      <div class="bossbar" id="bossbar"><div class="bar"><div class="fill" id="bossFill"></div></div><div class="lbl" id="bossLbl">BOSS</div></div>
      <div class="right">
        <div class="pill" id="best">BEST 0</div>
        <div class="gauge"><div id="gaugeFill"></div></div>
        <button class="pill mute" id="muteBtn" type="button">♪ ON</button>
        <div class="buffs" id="buffs"></div>
      </div>
      <div class="banner" id="banner"></div>
      <button class="tbtn l" id="tJump" type="button">점프</button>
      <button class="tbtn r" id="tSlide" type="button">슬라이드</button>
    </div>

    <div class="overlay" id="selectScreen">
      <div class="card">
        <h2>캐릭터 · 난이도 · 스테이지 선택</h2>
        <div class="chars" id="chars"></div>
        <div class="skill" id="skillTxt"></div>
        <div class="opts">
          <div class="opt"><div class="lb">난이도</div><div class="seg" id="segDiff"></div><div class="hint" id="diffHint"></div></div>
          <div class="opt"><div class="lb">시작 스테이지</div><div class="seg" id="segStage"></div><div class="hint" id="stageHint"></div></div>
          <div class="opt"><div class="lb">지형</div><div class="seg" id="segTerrain"></div><div class="hint" id="terrainHint"></div></div>
        </div>
        <div><button class="btn" id="startBtn">달리기 시작</button></div>
        <div class="hint" style="margin-top:6px">Space 점프·2단 점프 · ↓ 슬라이드 · Z 스킬 · Enter 시작</div>
      </div>
    </div>

    <div class="overlay" id="gameOverScreen" hidden>
      <div class="card">
        <h2 id="overTitle">에너지가 다 떨어졌어요!</h2>
        <div class="final" id="finalScore">0</div>
        <div class="final-sub" id="finalBest">최고 기록 0</div>
        <div class="row"><button class="btn" id="retryBtn">다시 달리기</button><button class="btn ghost" id="changeBtn">설정 변경</button></div>
      </div>
    </div>
  </div>
  <p class="footnote">캐릭터(달리기·슬라이드·점프·피격·승리), 4개 스테이지 배경, 펫, 보스, BGM은 Gemini(나노바나나·Lyria)로 생성했고 젤리·장애물·효과음은 코드로 만들었습니다.</p>
</div>

<script>
(function(){
  "use strict";
  var canvas=document.getElementById('game'), ctx=canvas.getContext('2d'), frame=document.getElementById('frame');
  var W=960,H=540;
  function resize(){ var r=frame.getBoundingClientRect(); var dpr=Math.min(window.devicePixelRatio||1,1.5); canvas.width=Math.round(r.width*dpr); canvas.height=Math.round(r.height*dpr); W=r.width; H=r.height; ctx.setTransform(dpr,0,0,dpr,0,0); }
  window.addEventListener('resize',resize); resize();

  // ---------- assets ----------
  var A={"far": "assets/far.jpg", "mid": "assets/mid.png", "ground": "assets/ground.png", "scene2": "assets/scene2.jpg", "scene3": "assets/scene3.jpg", "scene4": "assets/scene4.jpg", "ground2": "assets/ground2.png", "ground3": "assets/ground3.png", "ground4": "assets/ground4.png", "mid2": "assets/mid2.png", "mid3": "assets/mid3.png", "mid4": "assets/mid4.png", "pet": "assets/pet.png", "boss1": "assets/boss1.png", "bgm": "assets/bgm.mp3", "run_choco": "assets/run_choco.png", "slide_choco": "assets/slide_choco.png", "jump_choco": "assets/jump_choco.png", "hurt_choco": "assets/hurt_choco.png", "win_choco": "assets/win_choco.png", "run_berry": "assets/run_berry.png", "slide_berry": "assets/slide_berry.png", "jump_berry": "assets/jump_berry.png", "hurt_berry": "assets/hurt_berry.png", "win_berry": "assets/win_berry.png", "run_mint": "assets/run_mint.png", "slide_mint": "assets/slide_mint.png", "jump_mint": "assets/jump_mint.png", "hurt_mint": "assets/hurt_mint.png", "win_mint": "assets/win_mint.png", "run_caramel": "assets/run_caramel.png", "slide_caramel": "assets/slide_caramel.png", "jump_caramel": "assets/jump_caramel.png", "hurt_caramel": "assets/hurt_caramel.png", "win_caramel": "assets/win_caramel.png"};
  var IMG={};
  function img(key,mime){ if(!A[key]) return null; var im=new Image(); im.src=A[key]; IMG[key]=im; return im; }
  function ready(k){ var im=IMG[k]; return !!(im&&im.complete&&im.naturalWidth>0); }
  ['far','mid','ground','ground2','ground3','ground4','mid2','mid3','mid4','pet','boss1','boss2','boss3','boss4'].forEach(function(k){ img(k,'image/png'); });
  ['scene2','scene3','scene4'].forEach(function(k){ img(k,'image/jpeg'); });
  var CHARS=[
    {id:'choco',  name:'초코칩 쿠키 용사', type:'균형형',  speed:1.00, jump:1.00, guard:1.0, drain:1.00, jumps:2, skill:'초코 대시', skillDesc:'3초 동안 무적 + 젤리 자석', skillT:3.0},
    {id:'berry',  name:'딸기 쿠키 용사',   type:'스피드형', speed:1.12, jump:1.00, guard:1.0, drain:1.08, jumps:2, skill:'딸기 폭주', skillDesc:'4.5초 동안 초고속 무적 대시', skillT:4.5},
    {id:'mint',   name:'민트초코 닌자',    type:'점프형',  speed:1.02, jump:1.12, guard:1.0, drain:1.00, jumps:3, skill:'분신 도약', skillDesc:'3단 점프 + 3초 무적 대시', skillT:3.0},
    {id:'caramel',name:'캐러멜 쿠키 기사', type:'방어형',  speed:0.96, jump:0.98, guard:0.5, drain:0.92, jumps:2, skill:'설탕 방패', skillDesc:'충돌 피해 절반, 스킬 시 6초 방패', skillT:6.0}
  ];
  CHARS.forEach(function(c){ img('run_'+c.id,'image/png'); img('slide_'+c.id,'image/png'); img('jump_'+c.id,'image/png'); img('hurt_'+c.id,'image/png'); img('win_'+c.id,'image/png'); });
  var FRAMES=4;
  var STAGES=[
    {name:'벚꽃 숲',        far:'far',    mid:'mid',  ground:'ground',  edge:27/300, boss:'boss1', bossName:'꿀벌 여왕'},
    {name:'캔디 언덕',      far:'scene2', mid:'mid2', ground:'ground2', edge:14/300, boss:'boss2', bossName:'거대 젤리곰'},
    {name:'아이스크림 설산', far:'scene3', mid:'mid3', ground:'ground3', edge:34/300, boss:'boss3', bossName:'얼음 눈사람'},
    {name:'마녀의 호박 밤', far:'scene4', mid:'mid4', ground:'ground4', edge:26/300, boss:'boss4', bossName:'호박 마녀'}
  ];
  var DIFFS=[
    {id:'easy',  name:'쉬움', desc:'느린 속도, 여유로운 간격', spd:0.8,  gap:1.35, drain:0.75, dmg:0.7, bossHP:16},
    {id:'normal',name:'보통', desc:'기본 난이도',            spd:1.0,  gap:1.0,  drain:1.0,  dmg:1.0, bossHP:24},
    {id:'hard',  name:'어려움', desc:'빠른 속도, 빽빽한 장애물', spd:1.2, gap:0.75, drain:1.2,  dmg:1.3, bossHP:32},
    {id:'hell',  name:'지옥', desc:'극한 속도, 피해 2배',      spd:1.45, gap:0.6,  drain:1.4,  dmg:2.0, bossHP:40}
  ];
  var COURSE_LEN=19000, BOSS_AT=12500; // one course ≈ 50–60 s

  // ---------- audio ----------
  var AC=null, master=null, muted=false;
  var bgm=null; if(A.bgm){ bgm=new Audio(A.bgm); bgm.loop=true; bgm.volume=0.5; bgm.preload='auto'; }
  function audioInit(){ if(AC){ if(AC.state==='suspended') AC.resume(); return; } var C=window.AudioContext||window.webkitAudioContext; if(!C) return; AC=new C(); master=AC.createGain(); master.gain.value=muted?0:0.4; master.connect(AC.destination); }
  function tone(f,d,type,v,slide,delay){ if(!AC) return; var t0=AC.currentTime+(delay||0); var o=AC.createOscillator(), g=AC.createGain(); o.type=type||'square'; o.frequency.setValueAtTime(f,t0); if(slide) o.frequency.exponentialRampToValueAtTime(slide,t0+d); g.gain.setValueAtTime(0.0001,t0); g.gain.exponentialRampToValueAtTime(v||0.3,t0+0.01); g.gain.exponentialRampToValueAtTime(0.0001,t0+d); o.connect(g); g.connect(master); o.start(t0); o.stop(t0+d+0.02); }
  function noise(d,v){ if(!AC) return; var n=AC.sampleRate*d, b=AC.createBuffer(1,n,AC.sampleRate), c=b.getChannelData(0); for(var i=0;i<n;i++) c[i]=(Math.random()*2-1)*(1-i/n); var s=AC.createBufferSource(), g=AC.createGain(), f=AC.createBiquadFilter(); f.type='lowpass'; f.frequency.value=900; g.gain.value=v||0.3; s.buffer=b; s.connect(f); f.connect(g); g.connect(master); s.start(); }
  var sfx={
    jump:function(){ tone(420,0.18,'square',0.14,880); }, jump2:function(){ tone(600,0.16,'square',0.14,1200); },
    slide:function(){ noise(0.18,0.1); },
    coin:function(){ tone(1568,0.08,'triangle',0.14); tone(2093,0.12,'triangle',0.12,null,0.06); },
    jelly:function(){ tone(1046,0.09,'triangle',0.16); tone(1318,0.12,'triangle',0.14,null,0.07); },
    potion:function(){ tone(523,0.1,'triangle',0.18); tone(784,0.1,'triangle',0.18,null,0.1); tone(1046,0.25,'triangle',0.2,null,0.2); },
    giant:function(){ tone(196,0.4,'sawtooth',0.25,392); tone(392,0.5,'square',0.2,784,0.3); noise(0.3,0.2); },
    stomp:function(){ noise(0.2,0.35); tone(80,0.25,'sine',0.4,40); },
    hit:function(){ noise(0.25,0.3); tone(200,0.3,'sawtooth',0.18,60); },
    block:function(){ tone(880,0.08,'square',0.15); tone(660,0.12,'square',0.12,null,0.06); },
    skill:function(){ tone(523,0.12,'square',0.16); tone(659,0.12,'square',0.16,null,0.1); tone(784,0.12,'square',0.16,null,0.2); tone(1046,0.3,'square',0.2,null,0.3); },
    buff:function(){ tone(880,0.1,'triangle',0.18); tone(1318,0.18,'triangle',0.18,null,0.1); },
    stage:function(){ tone(784,0.12,'triangle',0.2); tone(988,0.12,'triangle',0.2,null,0.12); tone(1175,0.12,'triangle',0.2,null,0.24); tone(1568,0.4,'triangle',0.22,null,0.36); },
    bossHit:function(){ tone(300,0.08,'square',0.2,150); },
    bossDie:function(){ noise(0.5,0.4); tone(110,0.6,'sawtooth',0.3,30); tone(1046,0.3,'triangle',0.2,null,0.4); tone(1318,0.4,'triangle',0.2,null,0.6); },
    life:function(){ tone(330,0.3,'sawtooth',0.2,110); },
    over:function(){ tone(392,0.25,'triangle',0.22); tone(330,0.25,'triangle',0.22,null,0.25); tone(262,0.5,'triangle',0.22,null,0.5); }
  };
  var muteBtn=document.getElementById('muteBtn');
  muteBtn.addEventListener('click',function(){ muted=!muted; muteBtn.textContent=muted?'♪ OFF':'♪ ON'; if(bgm) bgm.muted=muted; if(master) master.gain.value=muted?0:0.4; });

  // ---------- settings ----------
  var STATE='select', CH=CHARS[0], DIFF=DIFFS[1], START_STAGE=0, HILLS=false;
  var best=0; try{ best=parseInt(localStorage.getItem('ckr4_best')||'0',10)||0; }catch(e){}
  try{ var sv=JSON.parse(localStorage.getItem('ckr4_set')||'{}'); CHARS.forEach(function(c){ if(c.id===sv.ch) CH=c; }); DIFFS.forEach(function(d){ if(d.id===sv.diff) DIFF=d; }); if(sv.stage>=0&&sv.stage<4) START_STAGE=sv.stage|0; HILLS=!!sv.hills; }catch(e){}
  function saveSet(){ try{ localStorage.setItem('ckr4_set',JSON.stringify({ch:CH.id,diff:DIFF.id,stage:START_STAGE,hills:HILLS})); }catch(e){} }

  var P, Wd, particles, floaters, PET, BOSS;

    else if(airborne&&ready('jump_'+CH.id)){ k='jump_'+CH.id; if(P.spin>0) ctx.rotate(P.spin*Math.PI*2); else ctx.rotate(P.tilt); }
    if(k){ var im=IMG[k]; var dh=sh*(k.indexOf('slide')===0?0.66:1.0), dw=dh*im.naturalWidth/im.naturalHeight; ctx.drawImage(im,-dw*0.5+(k.indexOf('slide')===0?sh*0.1:0),-dh,dw,dh); }
    else if(ready('run_'+CH.id)){ ctx.rotate(P.spin>0?P.spin*Math.PI*2:P.tilt); ctx.scale(1+P.squash*0.18,1-P.squash*0.22); var fw=run.naturalWidth/FRAMES, fh=run.naturalHeight, fi=airborne?(P.vy<0?1:2):(Math.floor(P.runT*9)%FRAMES); var dh2=sh, dw2=dh2*fw/fh; ctx.drawImage(run,fi*fw,0,fw,fh,-dw2*0.5,-dh2,dw2,dh2); }
    else { ctx.fillStyle='#8B5A34'; ctx.beginPath(); ctx.arc(0,-sh*0.5,sh*0.4,0,Math.PI*2); ctx.fill(); }
    ctx.restore();
    if(P.skill>0||P.speed>0){ ctx.strokeStyle='rgba(255,255,255,.6)'; ctx.lineWidth=2; for(var i=0;i<6;i++){ var yy=g-sh*(0.15+i*0.16), xx=px-sh*0.6-(Wd.scroll*3+i*70)%(W*0.5); ctx.beginPath(); ctx.moveTo(xx,yy); ctx.lineTo(xx-40-i*8,yy); ctx.stroke(); } }
  }
  function drawFX(){
    var i,p;
    for(i=0;i<particles.length;i++){ p=particles[i]; var t=1-p.age/p.life; ctx.globalAlpha=Math.max(0,t);
      if(p.color==='ring'){ ctx.strokeStyle=p.rc; ctx.lineWidth=4; ctx.beginPath(); ctx.ellipse(p.x,p.y,p.size+(1-t)*spriteH()*1.2,(p.size+(1-t)*spriteH()*1.2)*0.6,0,0,Math.PI*2); ctx.stroke(); }
      else if(p.star){ star(p.x,p.y,p.size*t*1.4,p.color); }
      else { ctx.fillStyle=p.color; ctx.beginPath(); ctx.arc(p.x,p.y,p.size*t,0,Math.PI*2); ctx.fill(); } }
    ctx.globalAlpha=1; ctx.textAlign='center'; ctx.lineWidth=3; ctx.strokeStyle='rgba(58,36,24,.8)';
    for(i=0;i<floaters.length;i++){ var f=floaters[i]; ctx.font='800 '+(H*(f.big?0.05:0.035))+'px "Baloo 2", sans-serif'; ctx.globalAlpha=1-f.age/(f.big?1.3:0.9); ctx.fillStyle=f.color; ctx.strokeText(f.txt,f.x,f.y); ctx.fillText(f.txt,f.x,f.y); }
    ctx.globalAlpha=1;
    if(Wd.flash>0){ ctx.globalAlpha=Math.min(1,Wd.flash/0.6)*0.85; ctx.fillStyle='#fff'; ctx.fillRect(0,0,W,H); ctx.globalAlpha=1; }
  }
  function draw(){
    ctx.save(); if(Wd.shake>0) ctx.translate((Math.random()-0.5)*10*Wd.shake/0.35,(Math.random()-0.5)*10*Wd.shake/0.35);
    drawScene(); drawBoss(); var i; for(i=0;i<Wd.obstacles.length;i++) drawObstacle(Wd.obstacles[i]); for(i=0;i<Wd.items.length;i++) drawItem(Wd.items[i]); drawPet(); drawPlayer(); drawFX(); ctx.restore();
  }
  var last=performance.now(), dtS=1/60;
  function loop(now){ var raw=Math.min(0.05,Math.max(0.001,(now-last)/1000)); last=now; dtS+=(raw-dtS)*0.6; var dt=Math.min(0.05,dtS); update(dt); draw(); requestAnimationFrame(loop); }
  document.addEventListener('visibilitychange',function(){ if(!document.hidden){ last=performance.now(); dtS=1/60; } });
  hud(); requestAnimationFrame(function(t){ last=t; requestAnimationFrame(loop); });
})();
</script>
