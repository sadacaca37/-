<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">

<title>불꽃 특공대 — 작전명: 강철 대왕게</title>
<style>
  html,body{margin:0;padding:0;background:#000;width:100%;height:100%;overflow:hidden}
  body{display:flex;align-items:center;justify-content:center}
  canvas{display:block;image-rendering:pixelated;image-rendering:crisp-edges;background:#000}

<canvas id="view" width="1920" height="1080"></canvas>
<script>

// ---- 01_core.js ----
'use strict';
// =====================================================================
//  불꽃 특공대 — 코어: 화면, 난수, 입력, 유틸
// =====================================================================
const W = 480, H = 270;              // 내부 도트 해상도 (1920x1080 = 4배)
const QS = new URLSearchParams(location.search);
const view = document.getElementById('view');
const vctx = view.getContext('2d');
const scr = mkCanvas(W, H);
const g = scr.getContext('2d');
g.imageSmoothingEnabled = false;

function mkCanvas(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; }

let SCALE = 4, D = 2;   // D: 내부 버퍼 밀도 (게임 좌표 1칸 = 버퍼 D칸). 인물은 이 밀도로 더 정밀하게 찍음
function resize() {
  const dpr = window.devicePixelRatio || 1;
  const fit = Math.min(innerWidth * dpr / W, innerHeight * dpr / H);
  let k = Math.floor(fit), css = k;
  // 정수 배율이 화면을 많이 남기면(타자팡 안의 작은 창 등) 한 단계 크게 그리고 창에 꽉 맞게 줄여서 보여 줌
  if (k < 1 || fit / k > 1.12) { k = Math.min(6, Math.ceil(fit)); css = fit; }
  if (QS.get('scale')) css = k = parseInt(QS.get('scale'), 10);
  k = Math.max(1, k || 4); css = css || k;
  SCALE = k;
  view.width = W * k; view.height = H * k;
  view.style.width = (W * css / dpr) + 'px';
  view.style.height = (H * css / dpr) + 'px';
  view.style.imageRendering = css === k ? '' : 'auto';
  vctx.imageSmoothingEnabled = false;
  D = (k % 2 === 0) ? 2 : k;
  scr.width = W * D; scr.height = H * D;
  g.setTransform(D, 0, 0, D, 0, 0); g.imageSmoothingEnabled = false;
}
addEventListener('resize', resize);
resize();

// ---------- 난수 (결정적: 자동 플레이 재현용) ----------
let _seed = 1;
function srand(s) { _seed = s >>> 0; }
function rnd() {
  _seed = (_seed + 0x6D2B79F5) | 0;
  let t = Math.imul(_seed ^ (_seed >>> 15), 1 | _seed);
  t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
  return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
}
const rr = (a, b) => a + rnd() * (b - a);
const ri = (a, b) => Math.floor(a + rnd() * (b - a + 1));
const pick = a => a[Math.floor(rnd() * a.length)];
const chance = p => rnd() < p;
// 렌더링 전용 난수 (게임 상태에 영향 없음)
const vr = Math.random;

// ---------- 유틸 ----------
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const sgn = v => v < 0 ? -1 : v > 0 ? 1 : 0;
const approach = (v, t, d) => v < t ? Math.min(v + d, t) : Math.max(v - d, t);
const hyp = Math.hypot;
const PI = Math.PI, TAU = PI * 2;
function overlap(a, b) { return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y; }
function hashi(x, y, s = 0) {
  let h = (x * 374761393 + y * 668265263 + s * 2246822519) | 0;
  h = Math.imul(h ^ (h >>> 13), 1274126177);
  return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
}
function vnoise(x, y, s = 0) {
  const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi;
  const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
  const a = hashi(xi, yi, s), b = hashi(xi + 1, yi, s), c = hashi(xi, yi + 1, s), d = hashi(xi + 1, yi + 1, s);
  return lerp(lerp(a, b, u), lerp(c, d, u), v);
}
const BAYER4 = [0, 8, 2, 10, 12, 4, 14, 6, 3, 11, 1, 9, 15, 7, 13, 5].map(v => (v + 0.5) / 16);
const bayer = (x, y) => BAYER4[(y & 3) * 4 + (x & 3)];

// ---------- 입력 ----------
const keys = {}, keysHit = {};
const KEYMAP = {
  l: ['ArrowLeft', 'KeyA'], r: ['ArrowRight', 'KeyD'], u: ['ArrowUp', 'KeyW'], d: ['ArrowDown', 'KeyS'],
  fire: ['KeyE', 'KeyJ'], jump: ['KeyX', 'KeyK', 'Space'], bomb: ['KeyC', 'KeyL'],
  lock: ['ShiftLeft', 'ShiftRight'], start: ['Enter', 'NumpadEnter'], esc: ['Escape'],
  pause: ['KeyP'], mute: ['KeyM'], coin: ['Digit5'],
};
addEventListener('keydown', e => {
  if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Space'].includes(e.code)) e.preventDefault();
  if (!keys[e.code]) keysHit[e.code] = true;   // 아주 짧은 탭도 한 프레임은 반드시 잡음
  keys[e.code] = true;
  if (typeof audioInit === 'function') audioInit();
});
addEventListener('keyup', e => { keys[e.code] = false; });
// 전체 화면 (F 키 / 더블클릭) — 1920x1080 화면에서 정확히 4배
function toggleFull() {
  if (document.fullscreenEnabled === false) return;   // 전체 화면이 막힌 창
  try {
    if (!document.fullscreenElement) {
      const r = document.documentElement.requestFullscreen && document.documentElement.requestFullscreen();
      if (r && r.catch) r.catch(() => { });
    } else if (document.exitFullscreen) { const r = document.exitFullscreen(); if (r && r.catch) r.catch(() => { }); }
  } catch (e) { /* 전체 화면이 막힌 환경(미리보기 창 등)에서는 무시 */ }
}
addEventListener('keydown', e => { if (e.code === 'KeyF' && !e.repeat) toggleFull(); });
addEventListener('dblclick', toggleFull);
addEventListener('mousedown', () => { if (typeof audioInit === 'function') audioInit(); });
addEventListener('blur', () => { for (const k in keys) keys[k] = false; });

// 게임패드: 보안 정책으로 막힌 창(미리보기 iframe 등)에서는 예외가 나므로 한 번 실패하면 끔
let PAD_OK = true;
function readPad() {
  if (!PAD_OK || !navigator.getGamepads) return null;
  let pads;
  try { pads = navigator.getGamepads() || []; } catch (e) { PAD_OK = false; return null; }
  for (const p of pads) {
    if (!p || !p.connected) continue;
    const b = i => p.buttons[i] && p.buttons[i].pressed;
    const ax = p.axes[0] || 0, ay = p.axes[1] || 0;
    return {
      l: b(14) || ax < -0.4, r: b(15) || ax > 0.4, u: b(12) || ay < -0.4, d: b(13) || ay > 0.4,
      fire: b(2), jump: b(0), bomb: b(1) || b(3), lock: b(5) || b(4), start: b(9), esc: b(8),
    };
  }
  return null;
}
function rawHuman() {
  const o = {};
  for (const k in KEYMAP) o[k] = KEYMAP[k].some(c => keys[c] || keysHit[c]);
  for (const c in keysHit) delete keysHit[c];
  const p = readPad();
  if (p) for (const k in p) o[k] = o[k] || p[k];
  return o;
}
// 프레임 단위 입력(눌림 엣지 포함)
const BTN = ['l', 'r', 'u', 'd', 'fire', 'jump', 'bomb', 'lock', 'start', 'esc', 'pause', 'mute', 'coin'];
function makeInput() { const o = { prev: {} }; for (const k of BTN) { o[k] = false; o.prev[k] = false; } return o; }
function feedInput(inp, raw) {
  for (const k of BTN) { inp.prev[k] = inp[k]; inp[k] = !!raw[k]; }
}
const pressed = (inp, k) => inp[k] && !inp.prev[k];

// ---- 02_audio.js ----
// =====================================================================
//  오디오: 전부 코드로 합성 (칩튠 음악 + 효과음)
// =====================================================================
const AU = { ctx: null, master: null, music: null, sfx: null, noise: null, pulse: {}, muted: false, gate: {} };

function audioInit() {
  if (AU.ctx) { if (AU.ctx.state === 'suspended') AU.ctx.resume(); return; }
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return;
  const c = AU.ctx = new AC();
  const comp = c.createDynamicsCompressor();
  comp.threshold.value = -16; comp.knee.value = 8; comp.ratio.value = 5; comp.attack.value = 0.003; comp.release.value = 0.15;
  comp.connect(c.destination);
  AU.master = c.createGain(); AU.master.gain.value = AU.muted ? 0 : 0.85; AU.master.connect(comp);
  AU.music = c.createGain(); AU.music.gain.value = 0.55; AU.music.connect(AU.master);
  AU.sfx = c.createGain(); AU.sfx.gain.value = 0.62; AU.sfx.connect(AU.master);
  const len = c.sampleRate * 2, b = c.createBuffer(1, len, c.sampleRate), d = b.getChannelData(0);
  for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
  AU.noise = b;
  // 패미컴풍 펄스파 (듀티 12.5 / 25 / 50%)
  for (const duty of [0.125, 0.25, 0.5]) {
    const n = 48, re = new Float32Array(n), im = new Float32Array(n);
    for (let k = 1; k < n; k++) re[k] = (2 / (k * PI)) * Math.sin(PI * k * duty);
    AU.pulse[duty] = c.createPeriodicWave(re, im);
  }
  // 거친 파형 (보스 포효/엔진)
  const curve = new Float32Array(256);
  for (let i = 0; i < 256; i++) { const x = i / 128 - 1; curve[i] = Math.tanh(x * 4); }
  AU.curve = curve;
  if (MUS.pending) { const p = MUS.pending; MUS.pending = null; playSong(p); }
}
function setMute(m) { AU.muted = m; if (AU.master) AU.master.gain.value = m ? 0 : 0.85; }

function tone(o) {
  const c = AU.ctx; if (!c) return;
  const t0 = c.currentTime + (o.t || 0) + 0.005;
  const dur = o.dur || 0.1, vol = o.vol == null ? 0.25 : o.vol;
  const osc = c.createOscillator();
  if (o.type === 'pulse') osc.setPeriodicWave(AU.pulse[o.duty || 0.5]);
  else osc.type = o.type || 'square';
  osc.frequency.setValueAtTime(o.f0, t0);
  if (o.f1) {
    if (o.lin) osc.frequency.linearRampToValueAtTime(o.f1, t0 + (o.slide || dur));
    else osc.frequency.exponentialRampToValueAtTime(Math.max(1, o.f1), t0 + (o.slide || dur));
  }
  const gn = c.createGain();
  const att = o.att || 0.003;
  gn.gain.setValueAtTime(0.0001, t0);
  gn.gain.linearRampToValueAtTime(vol, t0 + att);
  if (o.sus) gn.gain.setValueAtTime(vol, t0 + dur * o.sus);
  gn.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  let node = osc;
  if (o.vib) {
    const l = c.createOscillator(), lg = c.createGain();
    l.frequency.value = o.vibRate || 6; lg.gain.value = o.vib;
    l.connect(lg); lg.connect(osc.frequency); l.start(t0 + (o.vibDelay || 0)); l.stop(t0 + dur + 0.05);
  }
  if (o.dist) { const ws = c.createWaveShaper(); ws.curve = AU.curve; node.connect(ws); node = ws; }
  if (o.filter) {
    const f = c.createBiquadFilter(); f.type = o.filter; f.frequency.value = o.ff || 1000; f.Q.value = o.q || 1;
    if (o.ff1) f.frequency.exponentialRampToValueAtTime(o.ff1, t0 + dur);
    node.connect(f); node = f;
  }
  node.connect(gn); gn.connect(o.dest || AU.sfx);
  osc.start(t0); osc.stop(t0 + dur + 0.05);
}
function noise(o) {
  const c = AU.ctx; if (!c) return;
  const t0 = c.currentTime + (o.t || 0) + 0.005;
  const dur = o.dur || 0.2, vol = o.vol == null ? 0.25 : o.vol;
  const src = c.createBufferSource(); src.buffer = AU.noise;
  if (o.rate) src.playbackRate.value = o.rate;
  const f = c.createBiquadFilter(); f.type = o.ftype || 'lowpass'; f.frequency.setValueAtTime(o.f0 || 3000, t0); f.Q.value = o.q || 0.8;
  if (o.f1) f.frequency.exponentialRampToValueAtTime(o.f1, t0 + dur);
  const gn = c.createGain();
  gn.gain.setValueAtTime(0.0001, t0);
  gn.gain.linearRampToValueAtTime(vol, t0 + (o.att || 0.002));
  if (o.sus) gn.gain.setValueAtTime(vol, t0 + dur * o.sus);
  gn.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  src.connect(f); f.connect(gn); gn.connect(o.dest || AU.sfx);
  src.start(t0, Math.random() * 1.5); src.stop(t0 + dur + 0.05);
}
// 같은 소리 과다 중첩 방지
function gate(name, ms) {
  const c = AU.ctx; if (!c) return false;
  const now = c.currentTime * 1000;
  if (AU.gate[name] && now - AU.gate[name] < ms) return false;
  AU.gate[name] = now; return true;
}

// ---------------- 효과음 ----------------
const SFX = {
  pistol() { if (!gate('pistol', 30)) return; tone({ type: 'pulse', duty: 0.25, f0: 1400, f1: 180, dur: 0.07, vol: 0.18 }); noise({ dur: 0.05, vol: 0.18, f0: 5000, f1: 800 }); },
  mg() { if (!gate('mg', 40)) return; tone({ type: 'pulse', duty: 0.5, f0: 520, f1: 90, dur: 0.06, vol: 0.16 }); noise({ dur: 0.07, vol: 0.22, f0: 3500, f1: 500 }); },
  shotgun() { noise({ dur: 0.35, vol: 0.5, f0: 3000, f1: 200 }); tone({ type: 'triangle', f0: 160, f1: 40, dur: 0.25, vol: 0.5 }); tone({ type: 'pulse', duty: 0.5, f0: 300, f1: 60, dur: 0.12, vol: 0.18 }); },
  flame() { if (!gate('flame', 70)) return; noise({ dur: 0.14, vol: 0.2, ftype: 'bandpass', f0: 900, f1: 500, q: 0.7 }); noise({ dur: 0.1, vol: 0.08, ftype: 'highpass', f0: 3000 }); },
  vulcan() { if (!gate('vulcan', 35)) return; tone({ type: 'pulse', duty: 0.125, f0: 700, f1: 120, dur: 0.05, vol: 0.14 }); noise({ dur: 0.06, vol: 0.2, f0: 4000, f1: 600 }); },
  cannon() { noise({ dur: 0.5, vol: 0.55, f0: 1800, f1: 120 }); tone({ type: 'sine', f0: 140, f1: 35, dur: 0.4, vol: 0.7 }); tone({ type: 'pulse', duty: 0.5, f0: 220, f1: 50, dur: 0.2, vol: 0.2 }); },
  boom(sz = 1) {
    if (!gate('boom' + (sz > 1.5 ? 'B' : 's'), 55)) return;
    const d = 0.35 + sz * 0.35;
    noise({ dur: d, vol: Math.min(0.75, 0.35 + sz * 0.18), f0: 2400 + sz * 400, f1: 80 });
    tone({ type: 'sine', f0: 110 + 30 / sz, f1: 28, dur: d * 0.9, vol: Math.min(0.9, 0.45 + sz * 0.2) });
    if (sz > 1.2) noise({ t: 0.05, dur: d * 1.3, vol: 0.25, f0: 600, f1: 60, rate: 0.5 });
  },
  hit() { if (!gate('hit', 45)) return; tone({ type: 'pulse', duty: 0.5, f0: 240, f1: 120, dur: 0.05, vol: 0.12 }); },
  clang() { if (!gate('clang', 60)) return; tone({ type: 'pulse', duty: 0.125, f0: 1900, f1: 1500, dur: 0.08, vol: 0.09 }); tone({ type: 'triangle', f0: 760, dur: 0.12, vol: 0.12 }); },
  spark() { if (!gate('spark', 50)) return; noise({ dur: 0.05, vol: 0.12, ftype: 'highpass', f0: 4000 }); },
  jump() { tone({ type: 'pulse', duty: 0.25, f0: 220, f1: 440, dur: 0.08, vol: 0.06 }); },
  land() { if (!gate('land', 120)) return; noise({ dur: 0.07, vol: 0.12, f0: 700, f1: 200 }); },
  step() { if (!gate('step', 90)) return; noise({ dur: 0.03, vol: 0.04, f0: 1200, f1: 400 }); },
  throwG() { noise({ dur: 0.15, vol: 0.12, ftype: 'bandpass', f0: 600, f1: 2400, q: 2 }); },
  bounce() { if (!gate('bounce', 80)) return; tone({ type: 'triangle', f0: 600, f1: 300, dur: 0.06, vol: 0.12 }); },
  knife() { noise({ dur: 0.1, vol: 0.2, ftype: 'bandpass', f0: 5000, f1: 1500, q: 3 }); tone({ type: 'pulse', duty: 0.125, f0: 2500, f1: 900, dur: 0.07, vol: 0.06 }); },
  pickup() { [0, 4, 7, 12].forEach((s, i) => tone({ type: 'pulse', duty: 0.25, f0: 880 * Math.pow(2, s / 12), t: i * 0.045, dur: 0.07, vol: 0.12 })); },
  weapon() {
    [0, 4, 7, 12, 16, 19, 24].forEach((s, i) => tone({ type: 'pulse', duty: 0.5, f0: 440 * Math.pow(2, s / 12), t: i * 0.035, dur: 0.09, vol: 0.11 }));
    tone({ type: 'pulse', duty: 0.25, f0: 880, t: 0.26, dur: 0.35, vol: 0.12, vib: 18, vibRate: 9 });
    tone({ type: 'triangle', f0: 220, t: 0.26, dur: 0.35, vol: 0.2 });
  },
  coin() { tone({ type: 'pulse', duty: 0.5, f0: 988, dur: 0.07, vol: 0.14 }); tone({ type: 'pulse', duty: 0.5, f0: 1319, t: 0.07, dur: 0.35, vol: 0.14 }); },
  select() { tone({ type: 'pulse', duty: 0.25, f0: 660, f1: 990, dur: 0.06, vol: 0.12 }); },
  start() { [0, 7, 12, 19, 24].forEach((s, i) => tone({ type: 'pulse', duty: 0.5, f0: 330 * Math.pow(2, s / 12), t: i * 0.06, dur: 0.12, vol: 0.13 })); },
  scream(p = 1) {
    if (!gate('scream', 110)) return;
    const f = 520 * p * (0.85 + Math.random() * 0.35);
    tone({ type: 'sawtooth', f0: f, f1: f * 0.3, dur: 0.42, vol: 0.12, vib: 40, vibRate: 22, filter: 'bandpass', ff: 1100, q: 1.5, sus: 0.3 });
    tone({ type: 'pulse', duty: 0.25, f0: f * 1.5, f1: f * 0.45, dur: 0.35, vol: 0.04, vib: 30, vibRate: 20 });
  },
  hurt() { tone({ type: 'sawtooth', f0: 700, f1: 260, dur: 0.18, vol: 0.13, filter: 'bandpass', ff: 1200, q: 1.5 }); },
  heroDie() {
    tone({ type: 'sawtooth', f0: 900, f1: 140, dur: 0.75, vol: 0.16, vib: 60, vibRate: 14, filter: 'bandpass', ff: 1300, q: 1.2, sus: 0.35 });
    [0, -3, -7, -12].forEach((s, i) => tone({ type: 'pulse', duty: 0.25, f0: 520 * Math.pow(2, s / 12), t: 0.6 + i * 0.12, dur: 0.12, vol: 0.1 }));
  },
  thanks() {
    tone({ type: 'triangle', f0: 600, f1: 900, dur: 0.12, vol: 0.22, vib: 25, vibRate: 12 });
    tone({ type: 'triangle', f0: 900, f1: 700, t: 0.13, dur: 0.12, vol: 0.2, vib: 25, vibRate: 12 });
    tone({ type: 'triangle', f0: 1000, f1: 1300, t: 0.26, dur: 0.18, vol: 0.2, vib: 25, vibRate: 12 });
  },
  untie() { noise({ dur: 0.18, vol: 0.12, ftype: 'bandpass', f0: 1500, f1: 3000, q: 4 }); },
  mechStep() { if (!gate('mstep', 120)) return; tone({ type: 'sine', f0: 90, f1: 40, dur: 0.12, vol: 0.32 }); tone({ type: 'pulse', duty: 0.125, f0: 1200, f1: 900, dur: 0.04, vol: 0.04 }); },
  mechIn() { [0, 5, 7, 12].forEach((s, i) => tone({ type: 'pulse', duty: 0.25, f0: 330 * Math.pow(2, s / 12), t: i * 0.07, dur: 0.1, vol: 0.12 })); tone({ type: 'sawtooth', f0: 60, f1: 120, dur: 0.6, vol: 0.15, filter: 'lowpass', ff: 400 }); },
  eject() { tone({ type: 'pulse', duty: 0.5, f0: 300, f1: 1200, dur: 0.25, vol: 0.12 }); noise({ dur: 0.2, vol: 0.15, f0: 2000, f1: 500 }); },
  alarm() { for (let i = 0; i < 4; i++) { tone({ type: 'pulse', duty: 0.5, f0: 620, t: i * 0.5, dur: 0.25, vol: 0.11 }); tone({ type: 'pulse', duty: 0.5, f0: 460, t: i * 0.5 + 0.25, dur: 0.25, vol: 0.11 }); } },
  warn() { tone({ type: 'pulse', duty: 0.5, f0: 880, dur: 0.08, vol: 0.12 }); tone({ type: 'pulse', duty: 0.5, f0: 880, t: 0.12, dur: 0.08, vol: 0.12 }); },
  charge(d = 1) { tone({ type: 'sine', f0: 150, f1: 1800, dur: d, vol: 0.15, slide: d }); tone({ type: 'pulse', duty: 0.125, f0: 75, f1: 900, dur: d, vol: 0.05, slide: d, vib: 30, vibRate: 25 }); },
  laser(d = 1) { tone({ type: 'sawtooth', f0: 95, dur: d, vol: 0.28, vib: 18, vibRate: 30, sus: 0.85, dist: true }); noise({ dur: d, vol: 0.18, ftype: 'bandpass', f0: 1800, q: 0.6, sus: 0.85 }); tone({ type: 'pulse', duty: 0.25, f0: 1500, f1: 1300, dur: d, vol: 0.05, sus: 0.85 }); },

function ik2(hx, hy, fx, fy, l1, l2, bend) {

// ---------- 사실적인 총 ----------
function drawGun(pb, hand, ang, kind, P) {
  const dx = Math.cos(ang), dy = Math.sin(ang), px = -dy, py = dx;
  const [hx, hy] = hand;
  const at = (a, b) => [hx + dx * a + px * b, hy + dy * a + py * b];
  const Q = (pts, mat, sh = 0) => pb.poly(pts.map(([a, b]) => at(a, b)), mat, sh);
  const T = (a0, b0, r0, a1, b1, r1, mat, sh = 0) => { const p0 = at(a0, b0), p1 = at(a1, b1); pb.taper(p0[0], p0[1], r0, p1[0], p1[1], r1, mat, sh); };
  if (kind === 'pistol') {
    Q([[-0.2, 0.1], [1.1, 0.1], [0.75, 2.0], [-0.45, 1.9]], M.gun, -1);           // 손잡이
    Q([[-0.8, -0.8], [4.7, -0.8], [4.7, 0.2], [-0.8, 0.25]], M.gun);              // 슬라이드
    pb.line(...at(-0.4, -0.75), ...at(4.3, -0.75), M.gunL, 1);
    pb.dotp(...at(4.6, -0.3), 0, 0, M.dark);
    pb.dotp(...at(1.6, 0.6), 0, 0, M.gun, -2);
  } else if (kind === 'heavy') {
    Q([[-5.4, -0.55], [-2.5, -0.85], [-2.5, 0.85], [-5.2, 1.5]], M.gun, -1);      // 개머리판
    Q([[0.5, 0.7], [1.9, 0.7], [2.6, 3.5], [1.25, 3.7]], M.gun, -1);              // 휜 탄창
    Q([[-2.6, -1.0], [4.3, -1.0], [4.3, 0.75], [-2.6, 0.85]], M.gun);             // 몸통
    Q([[4.3, -0.8], [8.2, -0.6], [8.2, 0.5], [4.3, 0.6]], M.gunL);                // 총열 덮개
    for (let a = 4.9; a < 8; a += 1.0) pb.dotp(...at(a, -0.1), 0, 0, M.dark);
    T(8.2, -0.1, 0.34, 11.7, -0.1, 0.32, M.gun);                                  // 총열
    Q([[-1.6, -1.0], [2.8, -1.0], [2.4, -1.9], [-1.2, -1.9]], M.gun, 1);          // 운반 손잡이
    Q([[11.0, -0.4], [11.6, -0.4], [11.6, -1.1], [11.2, -1.1]], M.gun);
    pb.dotp(...at(0.8, -0.4), 0, 0, M.gold);
  } else if (kind === 'rifle') {
    Q([[-6.2, -0.4], [-2.2, -0.6], [-2.2, 0.7], [-6.0, 1.4]], M.wood);            // 나무 개머리
    Q([[0.6, 0.55], [1.7, 0.55], [2.0, 2.9], [0.95, 3.0]], M.gun, -1);
    Q([[-2.3, -0.75], [2.4, -0.75], [2.4, 0.6], [-2.3, 0.65]], M.gun);
    Q([[2.4, -0.6], [7.0, -0.5], [7.0, 0.4], [2.4, 0.5]], M.wood, 1);            // 나무 덮개
    T(7.0, -0.1, 0.3, 10.6, -0.1, 0.28, M.gun);
    pb.line(...at(-4.5, 1.2), ...at(5.5, 0.6), M.glove, -1);                     // 멜빵
  } else if (kind === 'bazooka') {
    T(-9.5, 0, 1.9, 9.0, 0, 1.9, M.eneH);
    for (const a of [-6, 0, 6]) T(a, 0, 2.05, a + 0.8, 0, 2.05, M.dsteel);
    T(9.0, 0, 2.2, 10.0, 0, 2.3, M.dsteel); pb.dotp(...at(10.0, 0), 0, 0, M.dark);
    Q([[1.0, 1.7], [2.2, 1.7], [2.0, 3.6], [0.9, 3.5]], M.gun);
    Q([[2.5, -1.9], [3.8, -1.9], [3.8, -2.9], [2.5, -2.9]], M.gun); pb.dotp(...at(3.1, -2.5), 0, 0, M.glowR);
  } else if (kind === 'knife') {
    Q([[0.4, -0.55], [5.8, -0.2], [6.6, 0.15], [0.4, 0.45]], M.white, 1);
    pb.line(...at(0.6, -0.3), ...at(5.6, -0.05), M.white, 2);
    T(-1.6, 0, 0.5, 0.2, 0, 0.5, M.glove);
    T(0.3, -1.0, 0.3, 0.3, 1.0, 0.3, M.gun);
  } else if (kind === 'grenade') {
    pb.ell(hx, hy - 0.8, 1.15, 1.35, M.olive); pb.taper(hx - 0.2, hy - 2.1, 0.35, hx + 0.6, hy - 1.2, 0.3, M.gunL);
  }
}

// ---------- 사실 비율 몸 ----------
const LOOK = {
  hero: { pants: 'khaki', shirt: 'hair', vest: 'olive', sleeve: 'hair', arm: 'skin', hand: 'glove', boot: 'boot', belt: 'boot' },
  enemy: { pants: 'ene', shirt: 'ene', vest: null, sleeve: 'ene', arm: 'ene', hand: 'glove', boot: 'glove', belt: 'glove' },
  pow: { pants: 'jump', shirt: 'jump', vest: null, sleeve: 'jump', arm: 'skin', hand: 'skin', boot: 'boot', belt: 'jump' },

function drawHuman(pb, st, P) {
  const S = STY[st], Lk = LOOK[st], R = pb.R || 1;
  const rot = P.rot || 0, c = Math.cos(rot), s = Math.sin(rot);
  const HX = HF.hx + (P.dx || 0) * SC, HY = HYN + (P.dy || 0) * SC, pv = -6;
  pb.T = (x, y) => { const yy = y - pv; return [(HX + (x * c - yy * s) * SC) * R, (HY + (pv + x * s + yy * c) * SC) * R]; };
  pb.Tang = rot; pb.K = SC * R;
  const lean = P.lean || 0;
  const tl = S.torso * 1.12;
  const neck = [Math.sin(lean) * tl, -Math.cos(lean) * tl];
  const ax = [Math.sin(lean), -Math.cos(lean)], fw = [Math.cos(lean), Math.sin(lean)];
  const tor = (t, off) => [ax[0] * tl * t + fw[0] * off, ax[1] * tl * t + fw[1] * off];
  const sh = [neck[0] * 0.86 + 0.5, neck[1] * 0.86 + 0.6];
  const shB = [sh[0] - 1.5, sh[1] + 0.3];
  const ht = lean + (P.tilt || 0), hl = 2.95;
  const head = [neck[0] + Math.sin(ht) * hl + 0.45 + (P.hox || 0) * 0.6, neck[1] - Math.cos(ht) * hl + (P.hoy || 0) * 0.6];
  const pM = M[Lk.pants], bM = M[Lk.boot];
  const leg = (foot, shd, front) => {
    const hip = [front ? 0.35 : -0.35, 0.45];
    const [knee, ank] = ik2(hip[0], hip[1], foot[0], foot[1], S.thigh, S.shin, 1);
    pb.taper(hip[0], hip[1], 2.2, knee[0], knee[1], 1.55, pM, shd);
    const bt = [lerp(knee[0], ank[0], 0.5), lerp(knee[1], ank[1], 0.5)];
    pb.taper(knee[0], knee[1], 1.55, bt[0], bt[1], 1.42, pM, shd);
    if (st === 'hero' && front) { const mp = [lerp(hip[0], knee[0], 0.55), lerp(hip[1], knee[1], 0.55)]; pb.ell(mp[0] - 0.2, mp[1], 0.95, 1.1, pM, shd - 1); }
    pb.taper(bt[0], bt[1], 1.38, ank[0], ank[1], 1.18, bM, shd);
    let ddx = ank[0] - knee[0], ddy = ank[1] - knee[1]; const Ln = Math.hypot(ddx, ddy) || 1; ddx /= Ln; ddy /= Ln;
    const f = [ddy, -ddx];
    const heel = [ank[0] - f[0] * 0.7 + ddx * 0.7, ank[1] - f[1] * 0.7 + ddy * 0.7], toe = [ank[0] + f[0] * 2.7 + ddx * 0.9, ank[1] + f[1] * 2.7 + ddy * 0.9];
    pb.taper(heel[0], heel[1], 1.05, toe[0], toe[1], 0.9, bM, shd);
    pb.taper(heel[0] + ddx * 0.95, heel[1] + ddy * 0.95, 0.42, toe[0] + ddx * 0.8, toe[1] + ddy * 0.8, 0.38, M.dark, 0);   // 밑창
    pb.line(knee[0] - f[0] * 1.2, knee[1] - f[1] * 1.2 + 0.3, knee[0] - f[0] * 0.4, knee[1] - f[1] * 0.4 + 0.6, pM, shd - 1);  // 무릎 주름
  };
  const arm = (shp, hand, shd) => {
    if (!hand) return;
    const [el, hd] = ik2(shp[0], shp[1], hand[0], hand[1], S.up, S.fore, -1);
    const mid = [lerp(shp[0], el[0], 0.55), lerp(shp[1], el[1], 0.55)];
    pb.ell(shp[0], shp[1], 1.5, 1.38, M[Lk.sleeve], shd);
    pb.taper(shp[0], shp[1], 1.45, mid[0], mid[1], 1.25, M[Lk.sleeve], shd);
    pb.taper(mid[0], mid[1], 1.22, el[0], el[1], 1.05, M[st === 'hero' ? 'skin' : Lk.arm], shd);
    pb.taper(el[0], el[1], 1.1, hd[0], hd[1], 0.84, M[Lk.arm], shd);
    pb.circ(hd[0], hd[1], 0.95, M[Lk.hand], shd);
  };
  if (!P.armsBehind) arm(shB, P.handB, -1);
  if (P.gunB) drawGun(pb, P.handB, P.gunB.ang, P.gunB.kind, P);
  if (!P.noLegs) {
    leg(P.footB, -1, false);
    pb.ell(0, 0.4, 2.85, 2.15, pM);                                 // 골반
    leg(P.footF, 0, true);
  }
  // 몸통
  const sM = M[Lk.shirt];
  pb.taper(...tor(-0.05, 0), 2.7, ...tor(0.74, 0.25), st === 'pow' ? 3.6 : 3.25, sM);
  pb.ell(...tor(0.66, 0.85), 2.45, 2.6, sM);                        // 가슴
  if (st === 'pow') pb.ell(...tor(0.25, 1.1), 2.6, 2.3, sM);        // 배
  if (Lk.vest) {
    const vM = M[Lk.vest];
    pb.taper(...tor(0.12, 0.05), 2.75, ...tor(0.7, 0.3), 3.05, vM);
    pb.ell(...tor(0.6, 0.9), 2.2, 2.25, vM);
    for (const [t, o] of [[0.3, 1.9], [0.48, 2.15]]) { const p0 = tor(t, o); pb.poly([[p0[0] - 0.75, p0[1] - 0.6], [p0[0] + 0.75, p0[1] - 0.6], [p0[0] + 0.75, p0[1] + 0.65], [p0[0] - 0.75, p0[1] + 0.65]], vM, -1); pb.line(p0[0] - 0.7, p0[1] - 0.55, p0[0] + 0.7, p0[1] - 0.55, vM, 1); }
    pb.line(...tor(0.95, -0.4), ...tor(0.22, 1.7), M.khaki, 0);      // 멜빵
    for (let t = 0.2; t < 0.7; t += 0.12) pb.line(...tor(t, -1.6), ...tor(t, -0.6), vM, -1);  // 몰리 띠
  }
  if (st === 'enemy') { pb.line(...tor(0.95, 0.6), ...tor(0.1, -0.6), M.glove, 0); pb.line(...tor(0.95, -1.0), ...tor(0.1, 1.2), M.glove, 0); const p0 = tor(0.15, 1.9); pb.poly([[p0[0] - 0.7, p0[1] - 0.7], [p0[0] + 0.7, p0[1] - 0.7], [p0[0] + 0.7, p0[1] + 0.6], [p0[0] - 0.7, p0[1] + 0.6]], M.glove); }
  if (st === 'pow') { pb.line(...tor(0.85, 0.5), ...tor(0.85, 2.6), M.white, 0); pb.dotp(...tor(0.6, 2.5), 0, 0, M.jump, -2); }
  pb.taper(...tor(0.0, -3.0), 0.62, ...tor(0.0, 3.05), 0.62, M[Lk.belt], st === 'pow' ? -1 : 0);   // 허리띠
  if (st !== 'pow') pb.dotp(...tor(0.0, 2.75), 0, 0, M.gold);
  if (P.ropes) { for (const t of [0.35, 0.6]) pb.taper(...tor(t, -3.3), 0.42, ...tor(t, 3.6), 0.42, M.rope); pb.taper(...tor(0.4, -3.2), 0.36, -4.6, 1.4, 0.32, M.rope, -1); }
  // 목·머리
  pb.taper(neck[0], neck[1] + 0.7, 1.2, head[0] - 0.3, head[1] + 1.3, 1.05, M.skin, -1);
  { const T0 = pb.T, HK = 1.12, K0 = pb.K;   // 머리 크기 보정
    pb.T = (x, y) => T0(head[0] + (x - head[0]) * HK, head[1] + (y - head[1]) * HK); pb.K = K0 * HK;
    if (S.head === 'hero') rHeadHero(pb, head[0], head[1], P);
    else if (S.head === 'enemy') rHeadEnemy(pb, head[0], head[1], P);

function buildLevel() {

  // --- 지형 ---
  const img = c.getImageData(0, 0, LW, H), d = new Uint32Array(img.data.buffer);
  const P = a => a.map(h => pack(hexRGB(h)));
  const PAL = {
    sand: P(['#f8e0a8', '#ecc684', '#d6a462', '#bd8a4c', '#9a6a38', '#7a5230']),
    camp: P(['#e2c08c', '#c8a070', '#ab8254', '#8e6a44', '#725236', '#5a3e2a']),
    road: P(['#c8c0b0', '#a29a8c', '#888072', '#6c665c', '#565048', '#403c36']),
    conc: P(['#d0ccc0', '#aeaa9e', '#928e84', '#76726a', '#5e5a54', '#46423e']),
    grass: P(['#a8d860', '#7cb840', '#56922c', '#3c7024', '#2a5420', '#1c3a18']),
    soil: P(['#8a6a44', '#74563a', '#5e4430', '#4a3426', '#38281e', '#281c16']),
    water: P(['#c8f0f0', '#88d0d8', '#58a8b8', '#3c8094', '#2c6074', '#20465a']),
    snow: P(['#ffffff', '#e8f0fa', '#c8d8ec', '#a4b8d4', '#8296b8', '#64789c']),
    ice: P(['#c8d0e0', '#a0aac0', '#7c86a0', '#5e6884', '#465068', '#323a50']),
    beach: P(['#fff0c8', '#f6d8a0', '#e8bc80', '#d09c64', '#b07c4c', '#8a6038']),
  };
  const STRIPE = pack(hexRGB('#f8c830'));
  for (let x = 0; x < LW; x++) {
    const gy = GY[x];
    for (let y = gy; y < H; y++) {
      const dep = y - gy;
      let b = biomeAt(x);
      const bb = biomeAt(x + 30 * (bayer(x, y) - 0.5) * 2); if (bb !== b && hashi(x, y) > 0.5) b = bb;
      let col;
      const n = vnoise(x / 7, y / 4, 3) + (hashi(x, y, 2) - 0.5) * 0.35;
      const deep = clamp(dep / 38, 0, 1);
      const base = (pal, k0) => pal[clamp(k0 + (n > 0.62 ? -1 : n < 0.32 ? 1 : 0) + Math.floor(deep * 2.4 + bayer(x, y) * 0.9), 1, 5)];
      if (b === 'sand' || b === 'beach') {
        const S = PAL[b];
        if (dep === 0) col = S[0]; else if (dep < 3) col = S[1];
        else { col = base(S, 2); if (hashi(x, y, 9) > 0.992) col = S[4]; }
        if (dep > 3 && ((y + Math.floor(Math.sin(x / 13) * 2)) % 9 === 0) && n > 0.45) col = S[clamp(3 + Math.floor(deep * 2), 0, 5)];
        if (b === 'beach' && dep > 8 && dep < 14 && ((x >> 3) + dep) % 7 === 0) col = S[3];
      } else if (b === 'camp') {
        const S = PAL.camp;
        if (dep === 0) col = S[0]; else if (dep < 3) col = S[1];

        const Gr = PAL.grass, So = PAL.soil;
        const gl = 3 + Math.floor(hashi(x >> 1, 3) * 3);

        else { col = base(So, 1); if (hashi(x >> 1, y >> 1, 7) > 0.97) col = Gr[4]; if (((x * 3 + y * 7) % 23 === 0) && dep > 6) col = So[0]; }
      } else if (b === 'water') {

        if (dep === 0) col = Wt[0]; else if (dep < 3) col = ((x + dep * 3) % 11 < 4) ? Wt[1] : Wt[2];
        else col = Wt[clamp(2 + Math.floor(deep * 3 + bayer(x, y) * 0.9 + wv), 2, 5)];
      } else if (b === 'city') {

        else if (dep === 6) col = C[4];

      } else { // snow (얼어붙은 땅)

function scorch(x, r) {

const SKY_DAY = ['#2c5cb0', '#3a6ec0', '#4a84cc', '#5e9cd8', '#7ab4e2', '#9ccae8', '#bfdcea', '#dfe6dc', '#f2e2c0'];

// 장식 소품 (제미나이 소품 시트가 있으면 그것, 없으면 코드 그림)
function propSprite(sheet, i) {
  const s = AIS[sheet]; if (!s) return null;
  const k = 'prop|' + sheet + '|' + i;
  const q = s.one ? 1 : 2;   // one: 시트가 게임 좌표 1:1
  return cached(k, () => {
    const c = mkCanvas(s.cw / q, s.ch / q), x = c.getContext('2d');
    x.imageSmoothingEnabled = q > 1; x.imageSmoothingQuality = 'high';
    x.drawImage(s.img, i * s.cw, 0, s.cw, s.ch, 0, 0, s.cw / q, s.ch / q);
    // 반투명 테두리 정리 (도트 느낌)
    const id = x.getImageData(0, 0, c.width, c.height), d = id.data;
    for (let p = 3; p < d.length; p += 4) d[p] = d[p] > 110 ? 255 : 0;
    x.putImageData(id, 0, 0);
    c.ax = s.ax / q; c.bx = (s.bc && s.bc[i]) ? s.bc[i][0] / q : c.width / 2;
    return c;
  });
}
// 소품 시트 칸의 실제 그림 범위 (게임 좌표)
function propBox(sheet, i) {
  const c = propSprite(sheet, i); if (!c) return null;
  return cached('pbox|' + sheet + '|' + i, () => {
    const d = c.getContext('2d').getImageData(0, 0, c.width, c.height).data;
    let x0 = 1e9, x1 = -1, y0 = 1e9, y1 = -1;
    for (let y = 0; y < c.height; y++) for (let x = 0; x < c.width; x++) if (d[(y * c.width + x) * 4 + 3]) { if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y; }
    return { x0, x1, y0, y1, w: x1 - x0 + 1, h: y1 - y0 + 1 };
  });
}
// 바닥 중심 x 에 맞춰 그리기
function putProp(c, sheet, i, x, yBottom, flip) {
  const cv = propSprite(sheet, i); if (!cv) return false;
  const b = propBox(sheet, i);
  const dx = Math.round(x - (b.x0 + b.w / 2)), dy = Math.round(yBottom - b.y1 - 1);
  if (!flip) c.drawImage(cv, dx, dy);
  else { c.save(); c.translate(Math.round(x * 2 - dx), dy); c.scale(-1, 1); c.drawImage(cv, 0, 0); c.restore(); }
  return true;
}

function stiltHutPB(w, legH) {

  pb.line(6, top + 6, w - 2, top + legH, M.wood, -1); pb.line(w - 2, top + 6, 6, top + legH, M.wood, -1);
  pb.rect(0, top, w + 8, 4, M.wood, 1); pb.rect(0, top + 3, w + 8, 2, M.wood, -2);
  pb.rect(6, 12, w - 4, top - 12, M.wood, -1);
  for (let x = 8; x < w; x += 6) pb.rect(x, 12, 1, top - 12, M.wood, -2);
  pb.rect(w / 2 - 4, 20, 9, top - 20, M.dark);
  pb.poly([[-2, 14], [w / 2 + 4, 0], [w + 10, 14]], M.tent);
  for (let x = 0; x < w + 8; x += 3) pb.rect(x, 13 + (x % 2), 1, 3, M.tent, -1);

}

}
function bunkerPB(w, h) {
  const pb = new PB(w, h);
  pb.poly([[0, h], [6, 8], [w - 6, 4], [w, h]], M.concrete);

// ---------------- 공용 ----------------

// ---------------- 폭발 ----------------
function explode(x, y, r, dmg, owner, size, opt = {}) {
  const nm = size || (r < 18 ? 's' : r < 30 ? 'm' : r < 48 ? 'l' : 'xl');
  fx(nm, x, y, nm === 's' ? 2 : 2);
  if (r >= 28) { fx('m', x + rr(-r * 0.4, r * 0.4), y + rr(-r * 0.3, 0), 2, 4); }
  if (r >= 44) { fx('l', x + rr(-r * 0.5, r * 0.5), y - rr(0, r * 0.4), 2, 8); fx('m', x + rr(-r * 0.6, r * 0.6), y - rr(0, r * 0.5), 2, 12); G.flash = Math.max(G.flash, 3); }

  smoke(x, y - 4, r / 5, Math.ceil(r / 12), -0.5);
  if (Math.abs(y - groundY(x)) < 12 && !opt.noScorch) scorch(x, Math.round(r * 0.8));
  if (opt.deb) debris(x, y, opt.deb, Math.ceil(r / 6), 2.6);
  else if (Math.abs(y - groundY(x)) < 12) debris(x, y - 2, 'rock', 3, 2);
  const R2 = r * r;
  if (owner === 'p') {
    for (const e of G.ents) if (!e.dead && e.hp > 0) {
      const b = hb(e), cx = clamp(x, b.x, b.x + b.w), cy = clamp(y, b.y, b.y + b.h);
      if ((cx - x) ** 2 + (cy - y) ** 2 <= R2) damageEnemy(e, dmg, 'blast', sgn(e.x - x) || 1);
    }
    for (const p of G.props) if (!p.dead) { const b = hb(p), cx = clamp(x, b.x, b.x + b.w), cy = clamp(y, b.y, b.y + b.h); if ((cx - x) ** 2 + (cy - y) ** 2 <= R2) hitProp(p, dmg, 'blast'); }
    for (const w of G.pows) if (w.state === 'tied' && Math.abs(w.x - x) < r && Math.abs(w.y - 10 - y) < r) freePow(w);
    if (G.boss) bossBlast(x, y, r, dmg);
  } else if (owner === 'e') {
    const P = G.player;
    if (P.state !== 'dead') {
      const t = P.mech ? hb(P.mech) : hb(P);
      const cx = clamp(x, t.x, t.x + t.w), cy = clamp(y, t.y, t.y + t.h);
      if ((cx - x) ** 2 + (cy - y) ** 2 <= R2 * 0.7) hurtPlayer();
    }
  }
}

// ---------------- 주인공 ----------------
function newPlayer(x) {

    state: 'play', t: 0, weapon: 'P', ammo: Infinity, bombs: 10, armor: 1, inv: 0, aim: 2, aimAng: 0, fireCD: 0, holdT: 0,

  }

  if (hor && !lock) tv = P.face * (P.crouch ? 0.65 : 1.55);

  P.vx = approach(P.vx, tv, P.onGround ? 0.45 : 0.3);

function knifeTarget() {

function updatePBullets() {

function updateParts() {
  for (const p of G.parts) {

function drawParts(layer) {

      case 'case': g.fillStyle = '#f0c040'; g.fillRect(sx, sy, 2, 1); g.fillStyle = '#9a6a10'; g.fillRect(sx + 1, sy, 1, 1); break;
      case 'smoke': { const k = p.life / p.max; const r = Math.max(1, Math.round(p.r * (0.6 + 0.5 * (1 - k)) * (k < 0.3 ? k / 0.3 : 1))); const c = smokeSprite(r, p.sh); g.drawImage(c, sx - c.width / 2 | 0, sy - c.height / 2 | 0); break; }
      case 'dust': { g.fillStyle = p.life > p.max * 0.5 ? '#f0d8a0' : '#d8b880'; const r = Math.max(1, Math.round(p.r * p.life / p.max)); g.fillRect(sx - (r >> 1), sy - (r >> 1), r, r); break; }
      case 'deb': { if (p.life < 20 && (p.life >> 1) % 2) break; const c = debrisSprite(p.kind, Math.floor(p.rot) & 7); spr(c, sx - c.width / 2, sy - c.height / 2); break; }
      case 'ash': g.fillStyle = p.life % 2 ? '#2a2020' : '#504444'; g.fillRect(sx, sy, 1, 1); break;
      case 'rope': g.fillStyle = '#c8a860'; g.fillRect(sx, sy, 2, 1); break;
      case 'txt': if (p.life > 10 || p.life % 2) digits(p.s, sx, sy, 'gold', 0.5); break;
      case 'word': if (p.life > 10 || p.life % 2) text(p.s, sx, sy - 8, 12, { color: '#ffffff' }, 0.5); break;
      case 'bang': { const y = sy - Math.min(6, (p.max - p.life)); if (p.life % 6 < 4) text('!', sx, y - 6, 16, { grad: ['#ffffff', '#ffe040', '#ff8020'] }, 0.5); break; }
    }
  }
}
function drawFx() {
  for (const f of G.fx) {
    if (f.t < 0) continue;
    if (f.name === 'shot') { // 산탄 화염 원뿔
      const k = f.f / 10, n = 7;
      for (let i = 0; i < n; i++) {

const BOSS_HP = 640;
const LEGS = [ // 붙는 위치(선체 기준), 발 오프셋, 굽힘 방향
  { ax: -62, ay: 40, fx: -46, bend: -1 }, { ax: -4, ay: 46, fx: -16, bend: -1 }, { ax: 56, ay: 40, fx: 34, bend: 1 },

function newBoss() {

    kind: 'crab', x: ARENA_X + 345, y: 128, alive: true, hp: BOSS_HP, maxHp: BOSS_HP, phase: 1, hull: 1, state: 'intro', t: 0, rise: 165,
    flash: 0, crouch: 0, bob: 0, claw: { T: [0, 0], open: 0, alive: true, parts: 3, ang: 2.2 }, turretAng: PI + 0.5, turret: true,
    pod: 0, podAlive: true, eyes: [true, true], eyeState: 0, atk: null, atkCD: 80, bag: [], legs: [true, true, true], shells: [],

function bossRel(B, rx, ry) { return [B.x + rx, B.y + ry + B.crouch + B.rise + B.bob + B.sink]; }
function bossShoulder(B) { return bossRel(B, -100, 18); }
function clawIK(B) {

}
function bossHullBox(B) { const [cx, cy] = bossRel(B, 0, 0); return { x: cx - 112, y: cy - 50, w: 228, h: 100 }; }
function crabHitTest(x, y) {
  const B = G.boss; if (!B || !B.alive || B.state === 'dead') return false;

    const k = clawIK(B);
    if (Math.hypot(x - k.T[0], y - k.T[1]) < 20 && B.claw.parts >= 3) return true;
    if (B.claw.parts >= 2 && distSeg(x, y, k.E, k.T) < 9) return true;
    if (distSeg(x, y, k.S, k.E) < 10) return true;
  }

  for (let i = 0; i < 2; i++) if (B.eyes[i]) { const e = eyePos(B, i); if (Math.hypot(x - e[0], y - e[1]) < 8) return true; }
  for (let i = 0; i < 3; i++) if (B.legs[i]) { const [H, K, F] = legJoints(B, i, false); if (distSeg(x, y, H, K) < 6 || distSeg(x, y, K, F) < 5) return true; }
  return false;
}
function legJoints(B, i, far) {
  const L = LEGS[i];
  const H = bossRel(B, L.ax + (far ? 14 : 0), L.ay - (far ? 6 : 0));
  const fxp = B.x + L.ax + L.fx + (far ? 10 : 0), fyp = groundY(fxp) - 2;

function distSeg(px, py, a, b) {

}
function eyePos(B, i) {

}
function bossVulnerable(B) { return B.state === 'fight'; }
function crabDamage(d, hx, hy, silent) {
  const B = G.boss; if (!B || !B.alive) return;
  if (!bossVulnerable(B)) { if (!silent) { SFX.clang(); spark(hx, hy, 2, '#c0c8ff'); } return; }
  let mul = 1;
  if (B.hull >= 3) { const [cx, cy] = bossRel(B, -48, -14); if (Math.hypot(hx - cx, hy - cy) < 24) { mul = 2; spark(hx, hy, 3, '#ff6040'); } }
  for (let i = 0; i < 2; i++) if (B.eyes[i]) { const e = eyePos(B, i); if (Math.hypot(hx - e[0], hy - e[1]) < 9) mul = 1.5; }

}
function crabBlast(x, y, r, dmg) {

  const h = bossHullBox(B);
  const cx = clamp(x, h.x, h.x + h.w), cy = clamp(y, h.y, h.y + h.h);

  if (!hit && B.claw.alive) { const k = clawIK(B); hit = distSeg(x, y, k.S, k.T) < r + 10; }

}
function crabShotgun(mx, my, ang, dmg) {
  const B = G.boss; if (!B || !B.alive) return;
  for (let d = 10; d <= 100; d += 10) { const x = mx + Math.cos(ang) * d, y = my + Math.sin(ang) * d; if (crabHitTest(x, y)) { crabDamage(dmg, x, y); return; } }
}
function bossTransition(ph) {
  const B = G.boss;

  G.stop = 10; G.flash = 4; shake(8);

}
function bossDie() {
  const B = G.boss;
  B.hp = 0; B.state = 'dying'; B.t = 0; B.atk = null; B.reticles = []; B.shockwaves = [];
  G.stop = 24; G.flash = 8; shake(10); stopSong();
  SFX.roar();

  addScore(30000, B.x - 60, B.y - 60);
}
function nextAttack(B) {
  const P = G.player;
  const lists = { 1: ['slam', 'shell', 'mg', 'slam', 'mg', 'shell'], 2: ['missile', 'slam', 'shell3', 'mg', 'missile', 'slam'], 3: ['laser', 'missile', 'mg', 'shell3', 'laser', 'mg'] };
  if (!B.bag.length) { B.bag = lists[B.phase].slice(); for (let i = B.bag.length - 1; i > 0; i--) { const j = ri(0, i); [B.bag[i], B.bag[j]] = [B.bag[j], B.bag[i]]; } }
  let a = B.bag.pop();
  if ((a === 'slam') && !B.claw.alive) a = 'mg';
  B.atk = { name: a, t: 0, n: 0 };
  if (a === 'slam') B.atk.tx = clamp(P.x, bossShoulder(B)[0] - 92, bossShoulder(B)[0] - 36);
}
function clawRest(B, t) { return [B.x - 172 + Math.sin(t / 40) * 4, groundY(B.x - 170) - 30 + Math.sin(t / 27) * 3]; }

function crabUpdate() {
  const B = G.boss; if (!B) return;
  const P = G.player, tgt = P.mech || P;
  B.t++;
  if (B.flash > 0) B.flash--;
  if (B.mf > 0) B.mf--;
  if (B.recoil > 0) B.recoil--;
  if (B.state === 'dead') { B.sink += 0.7; if (G.t % 5 === 0 && B.sink < 190) smoke(B.x + rr(-100, 100), groundY(B.x) - 10, 7, 1, -0.9); return; }
  B.hpShow = approach(B.hpShow, B.hp, B.state === 'intro' ? 6 : 4);
  B.bob = B.state === 'dying' ? 0 : Math.round(Math.sin(G.t / 22) * 1.5);
  // 집게 기본 자세
  const rest = clawRest(B, G.t);
  if (B.claw.alive && !(B.atk && B.atk.name === 'slam')) { B.claw.T[0] = lerp(B.claw.T[0], rest[0], 0.08); B.claw.T[1] = lerp(B.claw.T[1], rest[1] + B.crouch * 0.5, 0.08); B.claw.open = approach(B.claw.open, (G.t >> 5) % 2 ? 1 : 0, 0.05); }

    const [px, py] = bossRel(B, 38, -66);

    B.turretAng += clamp(angDiff(B.turretAng, clamp(want, PI * 0.7, PI * 1.45)), -0.03, 0.03);

function fireShell(B, tgt, off) {

    if (A.name === 'mg' && A.t < 24 && (A.t >> 2) % 2 && B.bridge) { const [bx, by] = this.brTL(B); g.fillStyle = '#ff3030'; g.fillRect(Math.round(bx - G.camX), Math.round(by) + 32, 4, 4); }
  },
  death(B) {

      [20, () => { if (B.mort) { B.mort = false; const [mx, my] = this.moTL(B); explode(mx + 22, my + 20, 30, 0, 'x', 'l', { noScorch: true }); bFly(B, bPart(BT.S, BT.MORT), mx + 22, my + 20, 2, -7, 0.3); } }],
      [70, () => { if (B.bridge) { B.bridge = false; const [bx, by] = this.brTL(B); explode(bx + 24, by + 40, 40, 0, 'x', 'l', { noScorch: true }); bFly(B, bPart(BT.S, BT.BRIDGE), bx + 24, by + 38, 1.2, -6, 0.15); } }],
      [205, () => { const [cx, cy] = this.coreP(B); explode(cx, cy, 54, 0, 'x', 'xl', { noScorch: true }); G.flash = 6; G.stop = 8; }],

  sinkSpd: 0.45,
  hazards(B, H) {

  },
  targets(B, me, T) {

    T.push({ e: B, b: { x: hx + 40, y: hy + 14, w: 60, h: 40 }, pr: 50, d: Math.abs(hx + 40 - me.x), boss: true });
    if (B.turret) { const [tx, ty] = this.turTL(B); T.push({ e: B, b: { x: tx + 6, y: ty + 10, w: 50, h: 30 }, pr: 55, d: Math.abs(tx - me.x), boss: true }); }
  },
  goal(B, m) { return B.bank - (m ? 70 : 56); },
};

// =====================================================================
//  3. 비행 전함 '먹구름'  (공중을 오가며 싸움 — 위·대각선 사격으로 상대)
//  1단계: 폭탄 투하(그림자 표시) / 볼 포탑 연사 / 주포 곡사
//  2단계: 뒤 엔진 폭파 → 기울며 미사일 일제사
//  3단계: 장갑이 찢겨 반응로 노출 → 수직 광선 훑기, 탄막
// =====================================================================
const SH = { S: 'boss_ship', BODY: 0, BODY2: 1, ENG: 2, BALL: 3, GUN: 4, BOMB: 5 };
BOSSES.ship = {
  name: '먹구름', title: '비행 전함',
  make() { return genMake('ship', 620, { x: ARENA_X + W + 160, y: 74, home: ARENA_X + 300, tx: ARENA_X + 300, gunAng: PI - 0.5, engF: true, engR: true, balls: [true, true], body2: false, ballAng: [PI * 0.75, PI * 0.75], tilt: 0 }); },
  bodyC(B) { return bPart(SH.S, B.body2 ? SH.BODY2 : SH.BODY); },
  TL(B) { return [B.x - 100, B.y - 53 + Math.round(Math.sin(G.t / 30) * 2) + B.sink]; },
  engP(B, i) { const [x, y] = this.TL(B); return i === 0 ? [x - 4, y + 54] : [x + 140, y + 52]; },  // 엔진 왼쪽 위
  ballC(B, i) { const [x, y] = this.TL(B); return [x + (i === 0 ? 62 : 112), y + 108]; },
  pivot(B) { const [x, y] = this.TL(B); return [x + 36, y + 90]; },
  coreP(B) { const [x, y] = this.TL(B); return [x + 105, y + 48]; },
  box(B) { const [x, y] = this.TL(B); return { x, y, w: 200, h: 122 }; },
  wall() { return Infinity; },
  introSolid(B) { return B.x < ARENA_X + W + 40; },
  hit(B, x, y) {
    const [bx, by] = this.TL(B);
    if (bHitPart(this.bodyC(B), bx, by, x, y)) return true;
    for (let i = 0; i < 2; i++) if (i === 0 ? B.engF : B.engR) { const [ex, ey] = this.engP(B, i); if (bHitPart(bPart(SH.S, SH.ENG), ex, ey, x, y)) return true; }
    for (let i = 0; i < 2; i++) if (B.balls[i]) { const [cx, cy] = this.ballC(B, i); if (Math.hypot(x - cx, y - cy) < 13) return true; }
    if (!B.body2) { const [px, py] = this.pivot(B); if (bHitBarrel(bPart(SH.S, SH.GUN), px, py, B.gunAng, x, y, 4)) return true; }
    return false;
  },
  mul(B, x, y) { if (B.body2) { const [cx, cy] = this.coreP(B); if (Math.hypot(x - cx, y - cy) < 20) return 2; } return 1; },
  tick(B, tgt) {
    if (B.state === 'dying' || B.state === 'dead') return;
    // 좌우 순항 (공격 중이 아니면 플레이어 위쪽 근처로)
    if (B.state === 'fight') {
      const A = B.atk;
      if (!A || A.name === 'balls' || A.name === 'cannon') { if (!B.cruise || B.t % 150 === 0) B.cruise = clamp(tgt.x + rr(40, 120), G.camX + 140, G.camX + W - 110); B.tx = B.cruise; }
      B.x = approach(B.x, B.tx, B.phase === 3 ? 1.1 : 0.8);
      B.tilt = approach(B.tilt, B.phase >= 2 && !B.engR ? 2 : 0, 0.05);
    }
    for (let i = 0; i < 2; i++) {
      if (!B.balls[i]) continue;
      const [cx, cy] = this.ballC(B, i), want = Math.atan2(tgt.y - 16 - cy, tgt.x - cx);
      B.ballAng[i] += clamp(angDiff(B.ballAng[i], want), -0.06, 0.06);
    }
    if (!B.body2) { const [px, py] = this.pivot(B); const want = clamp(Math.atan2(tgt.y - 10 - py, tgt.x - px), PI * 0.5, PI * 0.95); B.gunAng += clamp(angDiff(B.gunAng, want), -0.025, 0.025); }
    if (B.phase >= 2 && G.t % 7 === 0) { const [x, y] = this.TL(B); smoke(x + rr(60, 180), y + rr(10, 60), 6, 1, -0.6); }
    if (B.body2 && G.t % 6 === 0) { const [cx, cy] = this.coreP(B); fx('fire', cx + rr(-30, 30), cy + rr(-20, 10), 2); }
  },
  intro(B) {
    B.x = Math.max(B.home, B.x - 1.8); B.tx = B.x;

  },
  trans(B) {

    if (B.phase === 2) {

      if (t === 60) { const [ex, ey] = this.engP(B, 1); explode(ex + 20, ey + 20, 40, 0, 'x', 'l', { noScorch: true }); B.engR = false; bFly(B, bPart(SH.S, SH.ENG), ex + 20, ey + 20, 1, -2, 0.2); SFX.roar(); banner('엔진 파괴! 미사일 일제 사격', 90, 'red'); }

    if (t === 80) {

      A.dir = B.x > (left + right) / 2 ? -1 : 1; A.x0 = A.dir < 0 ? right : left; A.x1 = A.dir < 0 ? left : right;

  },
  runAtk(B, A, tgt) {

        }

      }
      case 'balls': {
        if (A.t === 2) SFX.warn();

        if (A.t >= 22 && (A.t - 22) % 14 === 0 && A.n < vol) {
          for (let i = 0; i < 2; i++) if (B.balls[i]) { const [cx, cy] = this.ballC(B, i); fireOrb(cx + Math.cos(B.ballAng[i]) * 12, cy + Math.sin(B.ballAng[i]) * 12, B.ballAng[i] + rr(-0.05, 0.05), 2.6); }
          SFX.mg(); A.n++;
        }
        return A.t > 22 + 14 * vol + 10;
      }
      case 'cannon': {
        if (B.body2) return true;
        if (A.t === 2) { SFX.warn(); A.tx = clamp(tgt.x, G.camX + 14, G.camX + W - 14); B.reticles = [{ x: A.tx, t: 0, dead: false }]; }
        if (A.t === 44) {
          const [px, py] = this.pivot(B), L = barrelLen(bPart(SH.S, SH.GUN)), mx = px + Math.cos(B.gunAng) * L, my = py + Math.sin(B.gunAng) * L;
          const b = fireArc(mx, my, A.tx, 40, 'bshell', 0.1); b.ret = B.reticles[0];

      }
      case 'missiles':

      }
      case 'sweep': {
        // 반응로가 땅을 훑는 수직 광선. 기체 이동보다 조금 느리게 따라옴

          if (P.state !== 'dead' && P.inv <= 0) { const pb = P.mech ? hb(P.mech) : hb(P); if (pb.x < A.bx + 7 && pb.x + pb.w > A.bx - 7) hurtPlayer(); }

  },
  draw(B) {

    const dark = B.state === 'dead' ? 0.5 : 0;
    const gy = groundY(B.x) + 2;

    const [x, y] = this.TL(B);
    if (B.tilt) { g.translate(Math.round(x + 100 - G.camX), Math.round(y + 50)); g.rotate(-B.tilt * 0.03); g.translate(-Math.round(x + 100 - G.camX), -Math.round(y + 50)); }

      // 프로펠러 잔상

      g.fillStyle = 'rgba(230,230,220,0.45)'; g.fillRect(px - 2, py - 15 + k * 3, 3, 30 - k * 6);

    if (B.body2 && B.state !== 'dead') { const [cx, cy] = this.coreP(B), r = 6 + ((G.t >> 3) % 2) * 2; g.fillStyle = 'rgba(255,244,200,0.9)'; g.fillRect(Math.round(cx - G.camX) - r / 2, Math.round(cy) - r / 2, r, r); }
    if (!B.body2) { const [px, py] = this.pivot(B); bBarrel(bPart(SH.S, SH.GUN), px, py, B.gunAng, fl, B.recoil > 0 ? 4 : 0); }

      g.fillStyle = '#7a7a84'; for (let k = 6; k < 17; k++) g.fillRect(Math.round(sx + Math.cos(a) * k), Math.round(sy + Math.sin(a) * k), 1, 1);

  },
  drawFx(B) {
    const A = B.atk; if (!A) return;
    if (A.name === 'bombs' && A.t >= 30) for (const dx of A.drops) if (!A['d' + dx]) { const gy = groundY(dx); if ((G.t >> 2) % 2) { g.fillStyle = 'rgba(20,10,10,0.5)'; g.fillRect(Math.round(dx - 10 - G.camX), gy - 2, 20, 3); } }
    if (A.name === 'sweep') {
      const gy = groundY(A.bx), sx = Math.round(A.bx - G.camX), [cx, cy] = this.coreP(B);
      if (A.t < 50) { if ((A.t >> 1) % 2) { g.fillStyle = '#ff3030'; g.fillRect(sx, Math.round(cy), 1, gy - Math.round(cy)); } if (A.t > 20 && (A.t >> 2) % 2) text('피해라!', sx, gy - 60, 16, { grad: ['#ffffff', '#ffe040', '#ff6020'] }, 0.5); }
      else if (A.t < 150) {
        const top = Math.round(cy) + 6, fl2 = G.t % 2;
        g.fillStyle = '#c01818'; g.fillRect(sx - 9 - fl2, top, 18 + fl2 * 2, gy - top);
        g.fillStyle = '#ff6020'; g.fillRect(sx - 7, top, 14, gy - top);
        g.fillStyle = '#ffd040'; g.fillRect(sx - 4, top, 8, gy - top);

  death(B) {

      [60, () => { B.balls[0] = false; const [cx, cy] = this.ballC(B, 0); explode(cx, cy, 24, 0, 'x', 'm', { noScorch: true }); }],
      [90, () => { B.balls[1] = false; const [cx, cy] = this.ballC(B, 1); explode(cx, cy, 24, 0, 'x', 'm', { noScorch: true }); }],
      [205, () => { const [cx, cy] = this.coreP(B); explode(cx, cy, 60, 0, 'x', 'xl', { noScorch: true }); G.flash = 6; G.stop = 8; }],

  },
  sinkSpd: 1.2,
  deadTick(B) { B.y += 0.6; },
  hazards(B, H) {

// =====================================================================
//  4. 설원 보행 병기 '빙결 거신'  (두 다리로 걷는 거대 로봇)
//  1단계: 개틀링 팔 난사(조준 회전) / 발 구르기 충격파 / 전진 짓밟기
//  2단계: 어깨 미사일 포드 전개 → 유도탄 일제사
//  3단계: 팔이 떨어져 나가고 가슴 반응로 노출 → 웅크려 지면 광선
// =====================================================================
const RB = { S: 'boss_robot', BODY: 0, BODY2: 1, ARM: 2, POD: 3, THIGH: 4, SHIN: 5 };
function bMirror(c) {
  if (!c) return null;
  return cached('bmir|' + (c._id || (c._id = Math.random().toString(36).slice(2))), () => {
    const m = mkCanvas(c.width, c.height), x = m.getContext('2d'); x.translate(c.width, 0); x.scale(-1, 1); x.drawImage(c, 0, 0);
    m.mask = new Uint8Array(c.mask.length);
    for (let y = 0; y < c.height; y++) for (let xx = 0; xx < c.width; xx++) m.mask[y * c.width + xx] = c.mask[y * c.width + (c.width - 1 - xx)];
    return m;
  });
}
// 회전 그리기: 그림 안의 축(px,py)을 (wx,wy)에 두고 rot 만큼 회전
function bDrawRot(c, wx, wy, px, py, rot, flash, dark) {
  if (!c) return;
  let s = c; if (flash) s = bFlash(c); else if (dark) s = tintOf(c, '#0a1020', dark);
  const r = Math.round(rot / (TAU / 64)) * TAU / 64;

  const lock = (x, f, cond) => S.push({ x, lock: true, f, cond });
  ST.script(at, lock);
  S.push({ x: ARENA_X, lock: true, f: () => { G.boss = newBossOf(ST.boss); }, cond: () => false });

// ---------------- 상태 전환 ----------------
function resetGame(auto) {

}
// 작전(스테이지) 불러오기: 점수·목숨·무기는 이어감
function loadStage(n) {

  srand(20261120 + n * 977);
  const keep = G.player && G.mode === 'clear' ? { weapon: G.player.weapon, ammo: G.player.ammo, bombs: G.player.bombs, armor: G.player.armor } : null;
  Object.assign(G, {
    mode: 'play', t: 0, camX: 0, lockX: null, lockCond: null, shake: 0, stop: 0, flash: 0, stage: n,
    ents: [], pb: [], eb: [], parts: [], fx: [], items: [], pows: [], props: [], timers: [], boss: null, si: 0, banner: null, warn: 0,
    go: 0, waveEnd: 0, clearT: 0, contT: 0, playT: 0, cheer: [], killsAtStart: G.kills, rescuedAtStart: G.rescued,
  });
  buildBackgrounds(); _bgBuilt = false;
  buildScript();
  botReset();
  G.player = newPlayer(60); G.player.y = 40; G.player.onGround = false; G.player.inv = 60;
  if (keep) Object.assign(G.player, keep);

  G.mode = 'cont'; G.contT = 600; playSong('cont');
}

}

    goal = front.type === 'heli' ? clamp(front.x - 20, G.camX + 40, G.camX + W - 60) : front.x - pref; why = 'fight';
  }
  if (G.lockX !== null && !(B && B.alive)) goal = clamp(goal, G.camX + 60, G.camX + 300);
  // 아이템 / 포로 / 메카
  const it = G.items.filter(i => onScreen(i.x, -8) && Math.abs(i.y - me.y) < 30).sort((a, b) => Math.abs(a.x - me.x) - Math.abs(b.x - me.x))[0];
  if (it && Math.abs(it.x - me.x) < 140 && (!front || Math.abs(front.x - me.x) > 70)) { goal = it.x; why = 'item'; }
  const pw = G.pows.find(w => w.state === 'tied' && onScreen(w.x, -8) && Math.abs(w.y - me.y) < 20);
  if (pw && (!front || front.x > pw.x - 10)) { goal = pw.x; why = 'pow'; }
  if (!m && G.mech && G.mech.state === 'parked' && onScreen(G.mech.x, 20) && (!B || !B.alive || B.phase < 3)) { goal = G.mech.x; why = 'mech'; }
  if (B && B.alive && bossDef(B)) {
    goal = clamp(bossDef(B).goal(B, m), G.camX + 24, Math.min(G.camX + W - 24, bossWall(!!m) - 4)); why = 'boss';
  } else if (B && B.alive) {
    const h = bossHullBox(B);
    goal = h.x - (m ? 92 : 78); why = 'boss';
    if (B.state === 'fight' && B.atk && B.atk.name === 'slam' && B.atk.t < 62) goal = Math.min(goal, B.atk.tx - 46);
    goal = clamp(goal, G.camX + 24, h.x - 40);
  }
  // ---------- 조준 ----------
  const T = botTargets();
  let aim = null;
  for (const t of T.slice(0, 7)) {
    const sols = botAimFor(t.b);
    if (sols.length) { aim = sols[0]; aim.t = t; break; }
  }
  // 대각선 정렬이 필요한 목표(옥상, 헬기)라면 위치 조정
  if (!aim && T.length) {
    const t = T[0], tb = t.b, cy = tb.y + tb.h / 2, my = me.y - (m ? 34 : 26);
    const dy = my - cy;
    if (dy > 30) { const side = me.x < tb.x ? -1 : 1; goal = clamp(tb.x + tb.w / 2 + side * (dy - 6), G.camX + 16, G.camX + W - 16); why = 'align'; }
  }
  const shortR = P.weapon === 'S' ? 92 : P.weapon === 'F' ? 100 : 999;   // 산탄총·화염은 사거리 밖이면 조준해도 소용없음
  const tooFar = aim && !m && aim.d > shortR && !(aim.t && aim.t.e && aim.t.e.type === 'heli');
  if (foes.length && (!aim || tooFar)) BOT.noAim = (BOT.noAim || 0) + 1; else BOT.noAim = 0;
  if (BOT.noAim > 60 && front && why === 'fight') goal = front.x - (m ? 60 : 44);
  if (BOT.noAim > 60 && !front && foes.length && why === 'go') {   // 뒤쪽 적을 못 맞히면 다가간다
    const f = foes.slice().sort((a, b) => Math.abs(a.x - me.x) - Math.abs(b.x - me.x))[0];
    const close = P.weapon === 'S' || P.weapon === 'F' ? 28 : 44;
    goal = clamp(f.x + (me.x >= f.x ? 1 : -1) * (m ? 60 : close), G.camX + 16, G.camX + W - 16); why = 'chase';
    // 발판 위에 있고 적이 아래에 있으면 발판 끝으로 내려간다
    if (me.onGround && me.plat && f.y > me.y + 16) { const pl = me.plat; goal = me.x > f.x ? Math.min(goal, pl.x - 12) : Math.max(goal, pl.x + pl.w + 12); }
  }
  let dir = Math.abs(goal - me.x) > 6 ? sgn(goal - me.x) : 0;
  if (why === 'pow' || why === 'item' || why === 'mech') dir = Math.abs(goal - me.x) > 2 ? sgn(goal - me.x) : 0;
  // ---------- 회피 ----------
  const H = botHazards();
  let act = dir < 0 ? 'L' : dir > 0 ? 'R' : 'S';
  BOT.curDir = act === 'L' ? -1 : act === 'R' ? 1 : 0;
  if (H.length) {
    const HS = H.filter(h => h.strict || h.boom >= 28), HB = H.filter(h => !(h.strict || h.boom >= 28));
    const ok = (c, w = 0) => (HS.length === 0 || botSim(c, HS, 56, w) >= 99) && (HB.length === 0 || botSim(c, HB, 40, w) > 26);
    if (!ok(act)) {
      const jj = act === 'R' ? 'jR' : act === 'L' ? 'jL' : 'j';
      const cands = [...new Set([jj, 'S', 'j', 'L', 'R', 'jL', 'jR'])];
      if (!m) cands.push('crouch');
      let pick = null;
      for (const c of cands) if (ok(c)) { pick = c; break; }
      if (!pick) {
        let waitOk = false;
        for (let w = 1; w <= 44 && !waitOk; w++) for (const c of [jj, 'j', 'jL', 'jR']) if (ok(c, w)) { waitOk = true; break; }
        if (waitOk) pick = act;
      }
      if (!pick) { let bv = -1; for (const c of cands.concat([act])) { const v = Math.min(HS.length ? botSim(c, HS, 56) : 99, HB.length ? botSim(c, HB, 40) : 99); if (v > bv) { bv = v; pick = c; } } }
      if (pick !== act) BOT.dodgeT = 6;
      act = pick;
    }
  }
  // ---------- 입력 조합 ----------
  const movingDir = act.includes('L') ? -1 : act.includes('R') ? 1 : 0;
  if (BOT.jumpHold > 0) { o.jump = true; BOT.jumpHold--; if (me.onGround && BOT.jumpHold < 18) { BOT.jumpHold = 0; o.jump = false; } }
  if (act.startsWith('j') && me.onGround && BOT.jumpHold === 0) { if (!BOT.prevJump) { o.jump = true; BOT.jumpHold = 24; } }
  if (act === 'crouch') o.d = true;
  if (aim) {
    const isHeli = aim.t && aim.t.e && aim.t.e.type === 'heli', rng = P.weapon === 'S' ? (isHeli ? 126 : 92) : P.weapon === 'F' ? 100 : 999;
    const urgent = aim.t && aim.t.e && (aim.t.e.state === 'aim' || aim.t.e.state === 'kneel' || aim.t.e.state === 'throw') && aim.d < 160;
    if (aim.d > rng && !m) aim = null;
    else if (movingDir !== 0 && movingDir !== aim.face && Math.abs(goal - me.x) > 36 && !urgent && why !== 'fight') aim = null;
  }
  if (aim) {
    const needFace = aim.face;
    const canWalkAim = movingDir !== 0 && movingDir === needFace && (aim.a === 1 || aim.a === 2 || (aim.a === 3 && me.onGround && !m));
    if (canWalkAim || (movingDir !== 0 && act !== 'S' && BOT.dodgeT > 0 && movingDir === needFace)) {
      if (movingDir < 0) o.l = true; else o.r = true;
      if (aim.a === 1 || aim.a === 0) o.u = true;
      if (aim.a === 3) o.d = true;
    } else if (movingDir !== 0 && BOT.dodgeT > 0) {
      if (movingDir < 0) o.l = true; else o.r = true; // 회피 우선
    } else {
      o.lock = true;
      if (needFace < 0) o.l = true; else o.r = true;
      if (aim.a === 0) { o.u = true; o.l = o.r = false; if (P.face !== needFace && !m) { o.lock = true; if (needFace < 0) o.l = true; else o.r = true; o.u = true; } }
      if (aim.a === 1) o.u = true;
      if (aim.a === 3) o.d = true;
      if (aim.crouch) { o.d = true; o.l = o.r = false; if (P.face !== needFace) { if (needFace < 0) o.l = true; else o.r = true; } }
      if (aim.a === 0 && (m ? m.face : P.face) !== needFace) { o.u = false; }
    }
    const W8 = WEAP[P.weapon];
    const inRange = P.weapon === 'S' ? aim.d < (aim.t && aim.t.e && aim.t.e.type === 'heli' ? 126 : 92) : P.weapon === 'F' ? aim.d < 100 : true;
    if (inRange) {
      if (!m && P.weapon === 'P') { BOT.tog ^= 1; o.fire = !!BOT.tog; } else o.fire = true;
    }
    // 수류탄 / 메카 포
    const t = aim.t;
    if (BOT.bombCD <= 0 && t) {
      const dx = (t.b.x + t.b.w / 2) - me.x;
      const heavy = t.boss || (t.e.type && t.e.type !== 'soldier') || t.e.sub === 'gunner';
      const crowd = foes.filter(e => Math.abs(e.x - (t.b.x + t.b.w / 2)) < 30).length >= 2;
      if (m && m.shells > 0 && Math.abs(dx) < 220 && Math.abs(dx) > 20 && (heavy || crowd) && sgn(dx) === (m.face)) { o.bomb = true; BOT.bombCD = 40; }
      else if (!m && P.bombs > 0 && dx * P.face > 40 && dx * P.face < 130 && (heavy || crowd) && Math.abs(t.b.y + t.b.h - me.y) < 30 + (t.boss ? 200 : 0) && P.onGround) { o.bomb = true; BOT.bombCD = t.boss ? 50 : 70; }
    }
  } else {
    if (movingDir < 0) o.l = true; else if (movingDir > 0) o.r = true;
    // 조준 해가 없을 때: 큰 표적이면 포/수류탄
    if (front && BOT.bombCD <= 0 && (front.type !== 'soldier' || front.sub === 'gunner')) {
      const dx = (front.x - me.x) * (m ? m.face : P.face);
      if (m && m.shells > 0 && dx > 30 && dx < 230 && front.type !== 'heli') { o.bomb = true; BOT.bombCD = 40; }
      else if (!m && P.bombs > 0 && dx > 40 && dx < 130 && front.type !== 'heli' && P.onGround) { o.bomb = true; BOT.bombCD = 70; }
    }
  }
  // 메카 탑승
  if (!m && why === 'mech' && G.mech && Math.abs(G.mech.x - P.x) < 10 && P.onGround) { o.d = true; o.l = o.r = false; o.lock = false; }
  // 보스 3단계에서 메카가 위험하면 탈출하지 않고 버팀(레이저는 점프로 회피)
  // 막힘 감지
  if (Math.abs(me.x - BOT.lastX) < 0.2 && why === 'go' && !aim) { if (++BOT.stuck > 50) { o.jump = true; BOT.jumpHold = 20; BOT.stuck = 0; } } else BOT.stuck = 0;
  BOT.lastX = me.x;
  BOT.prevJump = o.jump;
  BOT.dbg = { goal: Math.round(goal), why, act, aim: aim ? [aim.a, aim.face, aim.crouch, Math.round(aim.d), aim.t.e.type || aim.t.e.sub] : null, o: Object.keys(o).filter(k => o[k]).join(',') };
  return o;
}
