<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>1945 에어 컴뱃 (GitHub Edition)</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0A0D14;
      color: #FFF;
      font-family: 'Malgun Gothic', monospace, sans-serif;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      width: 100vw;
    }
    #gameWrapper {
      position: relative;
      width: 100%;
      height: 100%;
      max-width: 540px;
      max-height: 800px;
      background: #000;
      border: 3px solid #00D2FF;
      box-shadow: 0 0 35px rgba(0, 210, 255, 0.4), 0 0 100px rgba(0,0,0,0.9);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    canvas {
      width: 100%;
      height: 100%;
      display: block;
      image-rendering: pixelated;
      cursor: crosshair;
    }
    #hud {
      position: absolute;
      top: 10px;
      left: 12px;
      right: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      pointer-events: none;
      z-index: 10;
      font-family: monospace;
      font-weight: bold;
    }
    .hud-chip {
      background: rgba(10, 16, 32, 0.85);
      border: 1px solid #00D2FF;
      border-radius: 6px;
      padding: 4px 10px;
      font-size: 13px;
    }
    #controls {
      position: absolute;
      bottom: 10px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0,0,0,0.8);
      border: 1px solid rgba(255,255,255,0.2);
      padding: 4px 12px;
      border-radius: 15px;
      font-size: 10px;
      color: #AAA;
      display: flex;
      gap: 12px;
      z-index: 10;
      pointer-events: none;
    }
    #overlay {
      position: absolute;
      inset: 0;
      background: rgba(8, 12, 24, 0.93);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 20;
      text-align: center;
      padding: 24px;
    }
    #overlay h1 {
      font-size: 34px;
      color: #00D2FF;
      text-shadow: 0 0 20px rgba(0, 210, 255, 0.6);
      margin-bottom: 8px;
    }
    #overlay p {
      font-size: 13px;
      color: #ADC8E0;
      line-height: 1.6;
      margin-bottom: 24px;
      max-width: 400px;
    }
    .btn-action {
      background: linear-gradient(180deg, #00D2FF, #0066FF);
      color: #FFF;
      font-weight: 900;
      font-size: 16px;
      border: none;
      padding: 12px 36px;
      border-radius: 10px;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(0, 210, 255, 0.5);
      transition: all 0.2s;
    }
    .btn-action:hover {
      transform: scale(1.05);
      box-shadow: 0 6px 22px rgba(0, 210, 255, 0.8);
    }
    .audio-btn {
      position: absolute;
      top: 10px;
      right: 12px;
      background: rgba(20,25,45,0.85);
      border: 1px solid #446;
      color: #FFF;
      padding: 4px 8px;
      border-radius: 5px;
      font-size: 11px;
      cursor: pointer;
      z-index: 30;
    }
  </style>
</head>
<body>
  <div id="gameWrapper">
    <canvas id="canvas" width="480" height="720"></canvas>

    <!-- HUD -->
    <div id="hud">
      <div class="hud-chip">
        <span style="color:#88DFFF; font-size:10px;">SCORE</span><br>
        <span id="scoreVal" style="color:#FFD700; font-size:16px;">0</span>
      </div>
      <div class="hud-chip" style="text-align:center;">
        <span style="color:#88DFFF; font-size:10px;">STAGE 1</span><br>
        <span id="stageLabel" style="color:#00FFCC; font-size:14px;">PACIFIC OCEAN</span>
      </div>
      <div class="hud-chip" style="text-align:right;">
        <span style="color:#88DFFF; font-size:10px;">LIVES & BOMB</span><br>
        <span id="livesVal" style="color:#FF4757; font-size:14px;">✈️ x3</span>&nbsp;
        <span id="bombsVal" style="color:#FFAA00; font-size:14px;">💣 x2</span>
      </div>
    </div>

    <!-- Controls -->
    <div id="controls">
      <span><b>방향키/WASD</b> 이동</span>
      <span><b>Z/J/클릭</b> 기본 사격</span>
      <span><b>SPACE/X</b> 전탄 폭격</span>
    </div>

    <!-- Start & Over Overlay -->
    <div id="overlay">
      <h1 id="overlayTitle">✈️ 1945 AIR COMBAT</h1>
      <p id="overlayDesc">
        깃허브 오픈소스 HTML5 Canvas 1945 슈팅 엔진 공식 수록작!<br>
        적기를 격추하여 P 아이템으로 화력을 강화하고, 위기 시 화면 전체를 폭파하는 전술 폭탄을 투하하세요!
      </p>
      <button id="startBtn" class="btn-action">출격 시작 (SORTIE)</button>
    </div>

    <button id="muteBtn" class="audio-btn">🔊</button>
  </div>

  <script>
    // --- Audio Synthesizer ---
    let audioCtx = null;
    let isMuted = false;

    function initAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') audioCtx.resume();
    }

    function playSfx(type) {
      if (isMuted || !audioCtx) return;
      try {
        const now = audioCtx.currentTime;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);

        if (type === 'shoot') {
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(600, now);
          osc.frequency.exponentialRampToValueAtTime(160, now + 0.08);
          gain.gain.setValueAtTime(0.08, now);
          gain.gain.linearRampToValueAtTime(0, now + 0.08);
          osc.start(now);
          osc.stop(now + 0.08);
        } else if (type === 'hit') {
          osc.type = 'square';
          osc.frequency.setValueAtTime(200, now);
          osc.frequency.exponentialRampToValueAtTime(50, now + 0.1);
          gain.gain.setValueAtTime(0.12, now);
          gain.gain.linearRampToValueAtTime(0, now + 0.1);
          osc.start(now);
          osc.stop(now + 0.1);
        } else if (type === 'explosion') {
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(100, now);
          osc.frequency.exponentialRampToValueAtTime(20, now + 0.35);
          gain.gain.setValueAtTime(0.3, now);
          gain.gain.linearRampToValueAtTime(0, now + 0.35);
          osc.start(now);
          osc.stop(now + 0.35);
        } else if (type === 'bomb') {
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(80, now);
          osc.frequency.exponentialRampToValueAtTime(15, now + 0.8);
          gain.gain.setValueAtTime(0.5, now);
          gain.gain.linearRampToValueAtTime(0, now + 0.8);
          osc.start(now);
          osc.stop(now + 0.8);
        } else if (type === 'powerup') {
          osc.type = 'sine';
          osc.frequency.setValueAtTime(523, now);
          osc.frequency.setValueAtTime(659, now + 0.08);
          osc.frequency.setValueAtTime(784, now + 0.16);
          osc.frequency.setValueAtTime(1046, now + 0.24);
          gain.gain.setValueAtTime(0.2, now);
          gain.gain.linearRampToValueAtTime(0, now + 0.35);
          osc.start(now);
          osc.stop(now + 0.35);
        }
      } catch (e) {}
    }

    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const W = canvas.width;
    const H = canvas.height;

    let isPlaying = false;
    let score = 0;
    let lives = 3;
    let bombs = 2;
    let weaponLevel = 1;
    let gameTime = 0;
    let shockwave = 0;

    // Ocean Starfield background
    let stars = [];
    for (let i = 0; i < 70; i++) {
      stars.push({ x: Math.random() * W, y: Math.random() * H, speed: 1 + Math.random() * 3, size: Math.random() > 0.8 ? 2 : 1 });
    }

    // Player Fighter
    const player = {
      x: W / 2,
      y: H - 90,
      w: 42,
      h: 42,
      speed: 5.5,
      invulnerableTimer: 0,
      shootTimer: 0
    };

    let bullets = [];
    let enemyBullets = [];
    let enemies = [];
    let powerups = [];
    let particles = [];
    let boss = null;

    // Keys
    const keys = {};
    window.addEventListener('keydown', (e) => {
      initAudio();
      keys[e.key.toLowerCase()] = true;
      if (e.key === ' ' || e.code === 'Space' || e.key.toLowerCase() === 'x') {
        useBomb();
        e.preventDefault();
      }
    });
    window.addEventListener('keyup', (e) => {
      keys[e.key.toLowerCase()] = false;
    });

    // Mouse / Touch control
    let isMouseDown = false;
    canvas.addEventListener('mousedown', (e) => {
      initAudio();
      isMouseDown = true;
      moveWithPointer(e);
    });
    window.addEventListener('mouseup', () => { isMouseDown = false; });
    canvas.addEventListener('mousemove', (e) => {
      if (isMouseDown) moveWithPointer(e);
    });
    canvas.addEventListener('touchmove', (e) => {
      initAudio();
      if (e.touches.length > 0) {
        const touch = e.touches[0];
        const rect = canvas.getBoundingClientRect();
        player.x = (touch.clientX - rect.left) * (W / rect.width);
        player.y = (touch.clientY - rect.top) * (H / rect.height);
      }
      e.preventDefault();
    }, { passive: false });

    function moveWithPointer(e) {
      const rect = canvas.getBoundingClientRect();
      player.x = (e.clientX - rect.left) * (W / rect.width);
      player.y = (e.clientY - rect.top) * (H / rect.height);
    }

    function useBomb() {
      if (!isPlaying || bombs <= 0) return;
      bombs--;
      shockwave = 1.0;
      playSfx('bomb');

      // Wipe out all enemy bullets
      enemyBullets = [];

      // Heavy damage to all enemies
      enemies.forEach((en) => {
        en.hp -= 25;
        createExplosion(en.x, en.y, 10);
      });
      if (boss) {
        boss.hp -= 80;
        createExplosion(boss.x, boss.y, 20);
      }
      updateHud();
    }

    function spawnEnemy() {
      if (boss) return; // Don't overwhelm during boss fight

      if (Math.random() < 0.04) {
        // Scout plane
        enemies.push({
          type: 'scout',
          x: 40 + Math.random() * (W - 80),
          y: -30,
          w: 28,
          h: 28,
          vx: (Math.random() - 0.5) * 2,
          vy: 2.5 + Math.random() * 2,
          hp: 2,
          maxHp: 2,
          shootCooldown: 60 + Math.random() * 60,
          color: '#E63946'
        });
      }

      if (Math.random() < 0.015 && gameTime > 10) {
        // Heavy Bomber
        enemies.push({
          type: 'bomber',
          x: 60 + Math.random() * (W - 120),
          y: -50,
          w: 52,
          h: 46,
          vx: (Math.random() - 0.5) * 1.2,
          vy: 1.2,
          hp: 12,
          maxHp: 12,
          shootCooldown: 40,
          color: '#F4A261'
        });
      }

      // Boss trigger at 2500 points
      if (score >= 2500 && !boss) {
        boss = {
          x: W / 2,
          y: -100,
          targetY: 130,
          w: 130,
          h: 80,
          hp: 200,
          maxHp: 200,
          shootCooldown: 30,
          phase: 1
        };
      }
    }

    function createExplosion(x, y, count) {
      for (let i = 0; i < count; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = 1 + Math.random() * 4;
        particles.push({
          x: x,
          y: y,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed,
          life: 1.0,
          color: ['#FFDD00', '#FF4400', '#FFFFFF', '#FF8800'][Math.floor(Math.random() * 4)]
        });
      }
    }

    function updateHud() {
      document.getElementById('scoreVal').textContent = score;
      document.getElementById('livesVal').textContent = `✈️ x${lives}`;
      document.getElementById('bombsVal').textContent = `💣 x${bombs}`;
    }

    function update(dt) {
      if (!isPlaying) return;
      gameTime += dt;

      if (shockwave > 0) shockwave -= dt * 1.5;

      // Stars
      stars.forEach((s) => {
        s.y += s.speed;
        if (s.y > H) { s.y = 0; s.x = Math.random() * W; }
      });

      // Player Movement
      if (keys['arrowleft'] || keys['a']) player.x -= player.speed;
      if (keys['arrowright'] || keys['d']) player.x += player.speed;
      if (keys['arrowup'] || keys['w']) player.y -= player.speed;
      if (keys['arrowdown'] || keys['s']) player.y += player.speed;

      player.x = Math.max(player.w / 2, Math.min(W - player.w / 2, player.x));
      player.y = Math.max(player.h / 2, Math.min(H - player.h / 2, player.y));

      if (player.invulnerableTimer > 0) player.invulnerableTimer -= dt;

      // Auto Shooting (or hold Z / Space / Mouse)
      player.shootTimer -= dt;
      if (player.shootTimer <= 0) {
        player.shootTimer = 0.12;
        playSfx('shoot');

        if (weaponLevel === 1) {
          bullets.push({ x: player.x - 8, y: player.y - 20, vx: 0, vy: -12 });
          bullets.push({ x: player.x + 8, y: player.y - 20, vx: 0, vy: -12 });
        } else if (weaponLevel === 2) {
          bullets.push({ x: player.x - 14, y: player.y - 15, vx: -1, vy: -12 });
          bullets.push({ x: player.x - 5, y: player.y - 22, vx: 0, vy: -13 });
          bullets.push({ x: player.x + 5, y: player.y - 22, vx: 0, vy: -13 });
          bullets.push({ x: player.x + 14, y: player.y - 15, vx: 1, vy: -12 });
        } else {
          // Spread Cannon
          for (let a = -2; a <= 2; a++) {
            bullets.push({ x: player.x + a * 6, y: player.y - 20, vx: a * 1.8, vy: -12 });
          }
        }
      }

      // Update Bullets
      bullets.forEach((b) => {
        b.x += b.vx;
        b.y += b.vy;
      });
      bullets = bullets.filter((b) => b.y > -20 && b.x > -20 && b.x < W + 20);

      // Update Enemy Bullets
      enemyBullets.forEach((eb) => {
        eb.x += eb.vx;
        eb.y += eb.vy;

        // Hit Player
        if (player.invulnerableTimer <= 0) {
          const dist = Math.hypot(eb.x - player.x, eb.y - player.y);
          if (dist < 14) {
            handlePlayerHit();
          }
        }
      });
      enemyBullets = enemyBullets.filter((eb) => eb.y < H + 20 && eb.x > -20 && eb.x < W + 20);

      // Spawn and Update Enemies
      spawnEnemy();

      enemies.forEach((en) => {
        en.x += en.vx;
        en.y += en.vy;

        en.shootCooldown--;
        if (en.shootCooldown <= 0) {
          en.shootCooldown = 70 + Math.random() * 40;
          const angle = Math.atan2(player.y - en.y, player.x - en.x);
          enemyBullets.push({ x: en.x, y: en.y + 15, vx: Math.cos(angle) * 3.5, vy: Math.sin(angle) * 3.5 });
        }

        // Bullet collision
        bullets.forEach((b) => {
          if (Math.abs(b.x - en.x) < en.w / 2 && Math.abs(b.y - en.y) < en.h / 2) {
            b.y = -999;
            en.hp--;
            playSfx('hit');
            if (en.hp <= 0) {
              score += en.type === 'bomber' ? 250 : 100;
              playSfx('explosion');
              createExplosion(en.x, en.y, 12);
              if (Math.random() < 0.18) {
                powerups.push({ x: en.x, y: en.y, vy: 1.5, type: 'P' });
              }
              updateHud();
            }
          }
        });

        // Player Collision
        if (player.invulnerableTimer <= 0 && Math.hypot(en.x - player.x, en.y - player.y) < (en.w + player.w) / 2.8) {
          handlePlayerHit();
          en.hp = 0;
        }
      });
      enemies = enemies.filter((en) => en.hp > 0 && en.y < H + 40);

      // Boss Update
      if (boss) {
        if (boss.y < boss.targetY) boss.y += 1.2;
        boss.x += Math.sin(gameTime * 1.5) * 2;

        boss.shootCooldown--;
        if (boss.shootCooldown <= 0) {
          boss.shootCooldown = 35;
          // Spray 3-way bullets
          for (let k = -2; k <= 2; k++) {
            enemyBullets.push({ x: boss.x + k * 20, y: boss.y + 35, vx: k * 1.2, vy: 4 });
          }
        }

        bullets.forEach((b) => {
          if (Math.abs(b.x - boss.x) < boss.w / 2 && Math.abs(b.y - boss.y) < boss.h / 2) {
            b.y = -999;
            boss.hp--;
            playSfx('hit');
            if (boss.hp <= 0) {
              score += 5000;
              createExplosion(boss.x, boss.y, 50);
              playSfx('explosion');
              boss = null;
              updateHud();
              showOverlay('🏆 MISSION ACCOMPLISHED!', '거대 요새 폭격기를 격파하고 해역을 수호했습니다!');
            }
          }
        });
      }

      // Powerups
      powerups.forEach((p) => {
        p.y += p.vy;
        if (Math.hypot(p.x - player.x, p.y - player.y) < 25) {
          p.y = 9999;
          weaponLevel = Math.min(3, weaponLevel + 1);
          playSfx('powerup');
        }
      });
      powerups = powerups.filter((p) => p.y < H + 20);

      // Particles
      particles.forEach((pt) => {
        pt.x += pt.vx;
        pt.y += pt.vy;
        pt.life -= dt * 2;
      });
      particles = particles.filter((pt) => pt.life > 0);
    }

    function handlePlayerHit() {
      lives--;
      createExplosion(player.x, player.y, 25);
      playSfx('explosion');
      weaponLevel = Math.max(1, weaponLevel - 1);
      player.invulnerableTimer = 2.5;
      updateHud();

      if (lives <= 0) {
        showOverlay('💀 MISSION FAILED', '기체가 격추되었습니다. 다시 출격하세요!');
      }
    }

    function render() {
      ctx.clearRect(0, 0, W, H);

      // Ocean Background
      const grad = ctx.createLinearGradient(0, 0, 0, H);
      grad.addColorStop(0, '#0B1D2D');
      grad.addColorStop(1, '#08334C');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, W, H);

      // Stars
      ctx.fillStyle = '#A0E5FF';
      stars.forEach((s) => {
        ctx.fillRect(s.x, s.y, s.size, s.size);
      });

      // Bullets
      ctx.fillStyle = '#00FFCC';
      bullets.forEach((b) => {
        ctx.fillRect(b.x - 2, b.y - 7, 4, 14);
      });

      // Enemy Bullets
      ctx.fillStyle = '#FF3366';
      enemyBullets.forEach((eb) => {
        ctx.beginPath();
        ctx.arc(eb.x, eb.y, 4, 0, Math.PI * 2);
        ctx.fill();
      });

      // Enemies
      enemies.forEach((en) => {
        ctx.fillStyle = en.color;
        ctx.beginPath();
        ctx.moveTo(en.x, en.y + en.h / 2);
        ctx.lineTo(en.x - en.w / 2, en.y - en.h / 2);
        ctx.lineTo(en.x + en.w / 2, en.y - en.h / 2);
        ctx.closePath();
        ctx.fill();
        ctx.strokeStyle = '#FFFFFF';
        ctx.stroke();
      });

      // Boss
      if (boss) {
        ctx.fillStyle = '#772233';
        ctx.beginPath();
        ctx.roundRect(boss.x - boss.w/2, boss.y - boss.h/2, boss.w, boss.h, 15);
        ctx.fill();
        ctx.strokeStyle = '#FF3366';
        ctx.lineWidth = 3;
        ctx.stroke();

        // Boss HP Bar
        ctx.fillStyle = '#222';
        ctx.fillRect(boss.x - 50, boss.y - 50, 100, 8);
        ctx.fillStyle = '#FF3366';
        ctx.fillRect(boss.x - 50, boss.y - 50, (boss.hp / boss.maxHp) * 100, 8);
      }

      // Powerups
      powerups.forEach((p) => {
        ctx.fillStyle = '#FFDD00';
        ctx.beginPath();
        ctx.arc(p.x, p.y, 11, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#000';
        ctx.font = 'bold 12px sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('P', p.x, p.y);
      });

      // Particles
      particles.forEach((pt) => {
        ctx.fillStyle = pt.color;
        ctx.globalAlpha = pt.life;
        ctx.beginPath();
        ctx.arc(pt.x, pt.y, 3, 0, Math.PI * 2);
        ctx.fill();
        ctx.globalAlpha = 1.0;
      });

      // Player P-38 Lightning Fighter
      if (player.invulnerableTimer <= 0 || Math.floor(Date.now() / 100) % 2 === 0) {
        ctx.save();
        ctx.translate(player.x, player.y);

        // Wings
        ctx.fillStyle = '#2A9D8F';
        ctx.beginPath();
        ctx.roundRect(-24, -4, 48, 12, 4);
        ctx.fill();

        // Dual Engine Nacelles
        ctx.fillStyle = '#264653';
        ctx.fillRect(-18, -16, 8, 28);
        ctx.fillRect(10, -16, 8, 28);

        // Center Fuselage Cockpit
        ctx.fillStyle = '#E9C46A';
        ctx.beginPath();
        ctx.ellipse(0, -6, 6, 16, 0, 0, Math.PI * 2);
        ctx.fill();

        // Propeller flash
        ctx.fillStyle = '#A0E5FF';
        ctx.fillRect(-22, -18, 16, 2);
        ctx.fillRect(6, -18, 16, 2);

        ctx.restore();
      }

      // Shockwave Bomb effect
      if (shockwave > 0) {
        ctx.strokeStyle = `rgba(255, 255, 255, ${shockwave})`;
        ctx.lineWidth = shockwave * 30;
        ctx.beginPath();
        ctx.arc(W / 2, H / 2, (1 - shockwave) * W, 0, Math.PI * 2);
        ctx.stroke();
      }
    }

    function showOverlay(title, desc) {
      document.getElementById('overlayTitle').textContent = title;
      document.getElementById('overlayDesc').innerHTML = desc;
      document.getElementById('overlay').style.display = 'flex';
      isPlaying = false;
    }

    document.getElementById('startBtn').addEventListener('click', () => {
      initAudio();
      document.getElementById('overlay').style.display = 'none';
      score = 0;
      lives = 3;
      bombs = 2;
      weaponLevel = 1;
      gameTime = 0;
      shockwave = 0;
      bullets = [];
      enemyBullets = [];
      enemies = [];
      powerups = [];
      boss = null;
      player.x = W / 2;
      player.y = H - 90;
      player.invulnerableTimer = 1.0;
      isPlaying = true;
      updateHud();
    });

    document.getElementById('muteBtn').addEventListener('click', () => {
      isMuted = !isMuted;
      document.getElementById('muteBtn').textContent = isMuted ? '🔇' : '🔊';
    });

    // Main loop
    let lastT = performance.now();
    function loop(now) {
      const dt = Math.min(0.1, (now - lastT) / 1000);
      lastT = now;
      update(dt);
      render();
      requestAnimationFrame(loop);
    }
    requestAnimationFrame(loop);
  </script>
</body>
</html>
